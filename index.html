<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Bo's Content List</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-primary: #0a0a0f;
    --bg-secondary: #12121a;
    --bg-card: #1a1a2e;
    --bg-card-hover: #222240;
    --accent-gold: #f5c518;
    --accent-red: #e50914;
    --accent-blue: #4fc3f7;
    --accent-green: #66bb6a;
    --accent-purple: #ab47bc;
    --text-primary: #e8e8f0;
    --text-secondary: #9999aa;
    --text-muted: #666677;
    --border: #2a2a3e;
    --star-filled: #f5c518;
    --star-empty: #333355;
    --star-half: #f5c518;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: var(--bg-primary); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #444466; }

  /* Film grain overlay */
  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 9999;
    opacity: 0.4;
  }

  /* Animations */
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes slideIn { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }
  @keyframes glow { 0%, 100% { box-shadow: 0 0 5px rgba(245,197,24,0.2); } 50% { box-shadow: 0 0 20px rgba(245,197,24,0.4); } }
  @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  .fade-in { animation: fadeIn 0.3s ease-out; }

  /* Header */
  .header {
    background: linear-gradient(180deg, #0f0f1a 0%, var(--bg-primary) 100%);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
    padding-top: calc(16px + env(safe-area-inset-top, 0px));
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .header-inner {
    max-width: 1400px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .logo-icon {
    width: 44px;
    height: 44px;
    background: var(--accent-gold);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    box-shadow: 0 0 20px rgba(245,197,24,0.3);
  }

  .logo-text {
    font-family: 'Bebas Neue', cursive;
    font-size: 28px;
    letter-spacing: 2px;
    color: var(--text-primary);
  }

  .logo-sub {
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  /* Search bar */
  .search-bar {
    display: flex;
    align-items: center;
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 8px 16px;
    flex: 1;
    max-width: 400px;
    transition: border-color 0.2s;
  }

  .search-bar:focus-within { border-color: var(--accent-gold); }

  .search-bar input {
    background: transparent;
    border: none;
    color: var(--text-primary);
    font-size: 14px;
    outline: none;
    width: 100%;
    margin-left: 8px;
  }

  .search-bar input::placeholder { color: var(--text-muted); }

  /* Action buttons */
  .btn {
    padding: 8px 20px;
    border-radius: 8px;
    border: none;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .btn-primary {
    background: var(--accent-gold);
    color: #000;
  }

  .btn-primary:hover { background: #ffd633; transform: translateY(-1px); }

  .btn-secondary {
    background: var(--bg-card);
    color: var(--text-primary);
    border: 1px solid var(--border);
  }

  .btn-secondary:hover { background: var(--bg-card-hover); }

  .btn-danger {
    background: #331111;
    color: #ff6666;
    border: 1px solid #441111;
  }

  .btn-danger:hover { background: #441111; }

  .btn-sm { padding: 5px 12px; font-size: 12px; }

  /* Stats bar */
  .stats-bar {
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border);
    padding: 10px 24px;
  }

  .stats-inner {
    max-width: 1400px;
    margin: 0 auto;
    display: flex;
    gap: 24px;
    overflow-x: auto;
    align-items: center;
  }

  .stat {
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
    font-size: 13px;
    color: var(--text-secondary);
  }

  .stat-num {
    font-weight: 700;
    color: var(--accent-gold);
    font-size: 16px;
  }

  .clickable-stat {
    cursor: pointer;
    border-radius: 6px;
    padding: 2px 6px;
    transition: background 0.15s;
  }
  .clickable-stat:hover { background: rgba(245,197,24,0.08); }

  /* Recs panel */
  .recs-bar {
    background: linear-gradient(180deg, rgba(245,197,24,0.1) 0%, rgba(245,197,24,0.03) 100%);
    border-top: 2px solid rgba(245,197,24,0.4);
    border-bottom: 1px solid rgba(245,197,24,0.15);
    padding: 0 24px;
  }
  .recs-toggle {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 0; cursor: pointer; user-select: none;
  }
  .recs-toggle-label {
    display: flex; align-items: center; gap: 10px;
    font-size: 17px; font-weight: 700; color: var(--accent-gold);
    font-family: 'Bebas Neue', cursive; letter-spacing: 1.5px;
    text-shadow: 0 0 20px rgba(245,197,24,0.3);
  }
  .recs-badge {
    background: var(--accent-gold); color: #000;
    font-size: 11px; font-weight: 700; padding: 2px 8px;
    border-radius: 10px; min-width: 22px; text-align: center;
    font-family: 'Inter', sans-serif;
  }
  .recs-scroll {
    display: flex; gap: 14px; overflow-x: auto; padding-bottom: 16px;
    scrollbar-width: none;
  }
  .recs-scroll::-webkit-scrollbar { display: none; }
  .rec-card {
    flex-shrink: 0; width: 136px; background: var(--bg-card);
    border-radius: 12px; border: 1px solid rgba(255,255,255,0.1);
    overflow: hidden; position: relative;
    transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
    box-shadow: 0 4px 16px rgba(0,0,0,0.4);
  }
  .rec-card:hover {
    border-color: var(--accent-gold);
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.5), 0 0 12px rgba(245,197,24,0.15);
  }
  .rec-card-poster {
    width: 100%; aspect-ratio: 2/3; background: var(--bg-secondary);
    display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative;
  }
  .rec-card-poster img { width: 100%; height: 100%; object-fit: cover; }
  .rec-card-badge {
    position: absolute; top: 6px; left: 6px;
    font-size: 9px; font-weight: 800; padding: 3px 7px; border-radius: 5px;
    backdrop-filter: blur(6px); letter-spacing: 0.3px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.4);
  }
  .rec-badge-upcoming { background: rgba(79,195,247,0.92); color: #000; }
  .rec-badge-new { background: rgba(102,187,106,0.95); color: #000; }
  .rec-badge-similar { background: rgba(171,71,188,0.9); color: #fff; }
  .rec-desc-overlay {
    position: absolute; inset: 0; background: rgba(10,10,20,0.93);
    padding: 10px 10px 32px 10px; display: flex; flex-direction: column; justify-content: flex-start;
    font-size: 10px; line-height: 1.4; color: var(--text-secondary);
    border-radius: 12px; overflow-y: auto; overflow-x: hidden;
  }
  .rec-card-body { padding: 8px 10px; display: flex; flex-direction: column; height: 126px; }
  .rec-card-title {
    font-size: 12px; font-weight: 700; line-height: 1.3; color: var(--text-primary);
    overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    flex: 0 0 32px; margin-bottom: 4px;
  }
  .rec-card-reason { font-size: 10px; color: var(--accent-gold); line-height: 1.3; font-weight: 500; flex: 0 0 auto; max-height: 28px; overflow: hidden; }
  .rec-card-because { font-size: 9px; color: var(--text-muted); line-height: 1.3; font-style: italic; flex: 0 0 auto; max-height: 24px; overflow: hidden; margin-top: 3px; }
  .rec-card-actions { display: flex; gap: 5px; margin-top: auto; padding-top: 4px; }
  .rec-card-actions button {
    flex: 1; font-size: 11px; padding: 5px 4px; border-radius: 7px;
    border: 1px solid var(--border); cursor: pointer; font-weight: 700;
  }
  .rec-add-btn { background: var(--accent-gold); color: #000; border-color: var(--accent-gold) !important; }
  .rec-dismiss-btn { background: transparent; color: var(--text-muted); flex: 0 0 auto; padding: 5px 6px !important; font-size: 10px !important; }
  .recs-empty { padding: 16px 0; color: var(--text-muted); font-size: 13px; }
  @media (max-width: 768px) { .recs-bar { padding: 0 16px; } }

  /* Filter bar */
  .filter-bar {
    padding: 12px 24px;
    background: var(--bg-primary);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 76px;
    z-index: 90;
  }

  .filter-inner {
    max-width: 1400px;
    margin: 0 auto;
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 4px;
    flex-wrap: wrap;
  }

  .filter-chip {
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    border: 1px solid var(--border);
    background: var(--bg-secondary);
    color: var(--text-secondary);
    white-space: nowrap;
    user-select: none;
  }

  .filter-chip:hover { border-color: var(--accent-gold); color: var(--text-primary); }
  .filter-chip.active { background: var(--accent-gold); color: #000; border-color: var(--accent-gold); font-weight: 600; }

  .filter-section {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .filter-label {
    font-size: 11px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-right: 2px;
  }

  .filter-divider {
    width: 1px;
    height: 24px;
    background: var(--border);
    margin: 0 8px;
  }

  /* View toggle */
  .view-toggle {
    display: flex;
    background: var(--bg-secondary);
    border-radius: 8px;
    border: 1px solid var(--border);
    overflow: hidden;
  }

  .view-toggle button {
    padding: 6px 12px;
    background: transparent;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 16px;
    transition: all 0.2s;
  }

  .view-toggle button.active { background: var(--accent-gold); color: #000; }

  /* Content grid */
  .content-area {
    max-width: 1400px;
    margin: 0 auto;
    padding: 20px 24px;
  }

  /* Grid view */
  .grid-view {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 16px;
  }

  .card {
    background: var(--bg-card);
    border-radius: 12px;
    overflow: hidden;
    cursor: pointer;
    transition: all 0.3s;
    border: 1px solid transparent;
    position: relative;
  }

  .card:hover {
    transform: translateY(-4px);
    border-color: var(--accent-gold);
    box-shadow: 0 8px 32px rgba(245,197,24,0.15);
  }

  .card-poster {
    width: 100%;
    aspect-ratio: 2/3;
    background: linear-gradient(135deg, var(--bg-card) 0%, #252545 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 48px;
    position: relative;
    overflow: hidden;
  }

  .card-poster img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .card-poster .placeholder-icon {
    opacity: 0.3;
    font-size: 48px;
  }

  .card-status-badge {
    position: absolute;
    top: 8px;
    right: 8px;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .badge-watched { background: var(--accent-green); color: #000; }
  .badge-watching { background: var(--accent-blue); color: #000; }
  .badge-want { background: var(--accent-purple); color: #fff; }
  .badge-dont { background: var(--accent-red); color: #fff; }

  .card-info {
    padding: 10px 12px;
  }

  .card-title {
    font-size: 13px;
    font-weight: 600;
    line-height: 1.3;
    margin-bottom: 4px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .card-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 4px;
    flex-wrap: wrap;
  }

  .card-type {
    font-size: 11px;
    color: var(--text-muted);
  }

  .card-network {
    font-size: 10px;
    padding: 1px 6px;
    background: rgba(255,255,255,0.08);
    border-radius: 4px;
    color: var(--text-secondary);
  }

  .card-rating {
    display: flex;
    gap: 1px;
    margin-top: 4px;
  }

  .card-priority {
    position: absolute;
    top: 8px;
    left: 8px;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: rgba(0,0,0,0.7);
    border: 1.5px solid var(--accent-gold);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
    color: var(--accent-gold);
  }

  /* Table view */
  .table-view {
    width: 100%;
    overflow-x: auto;
  }

  .table-view table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }

  .table-view th {
    text-align: left;
    padding: 10px 12px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-muted);
    border-bottom: 1px solid var(--border);
    background: var(--bg-secondary);
    position: sticky;
    top: 0;
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
  }

  .table-view th:hover { color: var(--accent-gold); }

  .table-view td {
    padding: 10px 12px;
    border-bottom: 1px solid rgba(42,42,62,0.5);
    vertical-align: middle;
    white-space: nowrap;
  }

  .table-view tr:hover td { background: rgba(245,197,24,0.03); }

  .table-row-title {
    font-weight: 500;
    max-width: 250px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .table-poster-thumb {
    width: 32px;
    height: 48px;
    border-radius: 4px;
    object-fit: cover;
    vertical-align: middle;
    margin-right: 8px;
  }

  /* Star rating */
  .stars {
    display: inline-flex;
    gap: 1px;
    align-items: center;
  }

  .star-icon {
    width: 14px;
    height: 14px;
    position: relative;
    display: inline-block;
  }

  .star-icon svg { width: 14px; height: 14px; }

  /* Tags */
  .tag {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 500;
  }

  .tag-status-watched { background: rgba(102,187,106,0.15); color: #66bb6a; }
  .tag-status-watching { background: rgba(79,195,247,0.15); color: #4fc3f7; }
  .tag-status-want { background: rgba(171,71,188,0.15); color: #ce93d8; }
  .tag-status-dont { background: rgba(229,9,20,0.15); color: #ef5350; }
  .tag-status-airing { background: rgba(255,167,38,0.15); color: #ffa726; }
  .tag-status-gap { background: rgba(255,167,38,0.15); color: #ffcc80; }

  .tag-type { background: rgba(255,255,255,0.06); color: var(--text-secondary); }
  .tag-who { background: rgba(255,255,255,0.06); color: var(--text-secondary); }

  .tag-nonfree {
    background: rgba(245,197,24,0.15);
    color: var(--accent-gold);
    font-weight: 700;
  }

  /* Modal */
  .modal-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.85);
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow-y: auto;
    animation: fadeIn 0.2s;
  }

  .modal {
    background: var(--bg-secondary);
    border-radius: 16px;
    border: 1px solid var(--border);
    max-width: 700px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    animation: fadeIn 0.3s;
    flex-shrink: 0;
  }

  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 24px;
    border-bottom: 1px solid var(--border);
  }

  .modal-header h2 {
    font-family: 'Bebas Neue', cursive;
    font-size: 24px;
    letter-spacing: 1px;
  }

  .modal-close {
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 24px;
    cursor: pointer;
    padding: 4px;
    line-height: 1;
  }

  .modal-close:hover { color: var(--text-primary); }

  .modal-body { padding: 24px; }

  /* Form */
  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  .form-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .form-group.full-width { grid-column: 1 / -1; }

  .form-group label {
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-secondary);
  }

  .form-group label .required { color: var(--accent-red); }

  .form-input, .form-select {
    padding: 10px 14px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text-primary);
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
    font-family: inherit;
  }

  .form-input:focus, .form-select:focus { border-color: var(--accent-gold); }

  .form-select { cursor: pointer; }
  .form-select option { background: var(--bg-card); color: var(--text-primary); }

  .form-actions {
    display: flex;
    gap: 12px;
    justify-content: flex-end;
    margin-top: 24px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }

  /* Detail modal */
  .detail-header {
    display: flex;
    gap: 20px;
    margin-bottom: 20px;
  }

  .detail-poster {
    width: 150px;
    min-width: 150px;
    aspect-ratio: 2/3;
    border-radius: 12px;
    overflow: hidden;
    background: var(--bg-card);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .detail-poster img { width: 100%; height: 100%; object-fit: cover; }

  .detail-info { flex: 1; }

  .detail-title {
    font-family: 'Bebas Neue', cursive;
    font-size: 32px;
    letter-spacing: 1px;
    line-height: 1.1;
    margin-bottom: 8px;
  }

  .detail-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 12px;
  }

  .detail-field {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid rgba(42,42,62,0.5);
    font-size: 14px;
  }

  .detail-field-label { color: var(--text-muted); }
  .detail-field-value { font-weight: 500; text-align: right; }

  /* Rating input */
  .rating-input {
    display: flex;
    gap: 4px;
    align-items: center;
  }

  .rating-star-btn {
    background: none;
    border: none;
    cursor: pointer;
    padding: 2px;
    position: relative;
    width: 28px;
    height: 28px;
  }

  .rating-star-btn svg { width: 24px; height: 24px; }

  /* Multi-select chips */
  .multi-select {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .multi-chip {
    padding: 4px 10px;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--bg-card);
    color: var(--text-secondary);
    transition: all 0.2s;
    user-select: none;
  }

  .multi-chip:hover { border-color: var(--accent-gold); }
  .multi-chip.selected { background: var(--accent-gold); color: #000; border-color: var(--accent-gold); font-weight: 600; }

  /* Empty state */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
  }

  .empty-state-icon { font-size: 64px; margin-bottom: 16px; opacity: 0.5; }
  .empty-state-text { font-size: 18px; margin-bottom: 8px; }
  .empty-state-sub { font-size: 14px; }

  /* Pagination / load more */
  .load-more {
    text-align: center;
    padding: 24px;
  }

  /* Responsive */
  .filter-mobile-bar {
    display: none;
  }
  .filter-inner-wrap { display: block; }
  .tools-desktop-only { display: flex; }

  /* Mobile filter dropdown styles */
  .filter-mobile-dropdowns { display: none; }
  .filter-mobile-select {
    appearance: none; -webkit-appearance: none;
    background: var(--bg-secondary); color: var(--text-secondary);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 10px; font-size: 13px; width: 100%;
    cursor: pointer; outline: none;
  }
  .filter-mobile-select.active {
    background: var(--accent-gold); color: #000; border-color: var(--accent-gold); font-weight: 600;
  }
  .filter-mobile-label {
    font-size: 10px; color: var(--text-muted); text-transform: uppercase;
    letter-spacing: 0.05em; margin-bottom: 4px; font-weight: 600;
  }
  .filter-platform-scroll {
    display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px;
    scrollbar-width: none;
  }
  .filter-platform-scroll::-webkit-scrollbar { display: none; }

  @media (max-width: 768px) {
    .header-inner { flex-direction: column; align-items: stretch; gap: 12px; }
    .search-bar { max-width: 100%; }
    .logo-text { font-size: 22px; }
    .grid-view { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
    .form-grid { grid-template-columns: 1fr; }
    .detail-header { flex-direction: column; align-items: center; text-align: center; }
    .detail-poster { width: 120px; min-width: 120px; }
    .content-area { padding: 12px; }
    .stats-inner { gap: 16px; }
    .modal-overlay { align-items: flex-start; padding: 12px; }
    .modal { margin: 0 auto; max-height: none; width: 100%; }
    .header { padding: 12px 16px; }
    .filter-bar { padding: 8px 16px; top: auto; position: relative; }
    .filter-mobile-bar { display: flex; align-items: center; justify-content: space-between; padding: 8px 16px; cursor: pointer; }
    .filter-inner-wrap { display: none; }
    .filter-inner-wrap.open { display: block; }
    .filter-desktop-chips { display: none !important; }
    .filter-mobile-dropdowns { display: block; }
    .tools-desktop-only { display: none !important; }
  }

  @media (max-width: 480px) {
    .grid-view { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; }
    .card-info { padding: 8px; }
    .card-title { font-size: 12px; }
  }

  /* Toast notification */
  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    left: 24px;
    max-width: 420px;
    margin: 0 auto;
    background: var(--bg-card);
    border: 1px solid var(--accent-gold);
    border-radius: 12px;
    padding: 12px 16px;
    font-size: 14px;
    z-index: 300;
    animation: fadeIn 0.3s;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    display: flex;
    align-items: flex-start;
    gap: 10px;
    word-break: break-word;
  }
  .toast-msg { flex: 1; line-height: 1.4; }
  .toast-undo {
    flex-shrink: 0;
    background: var(--accent-gold);
    color: #000;
    border: none;
    border-radius: 6px;
    padding: 3px 10px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
    align-self: center;
  }
  @media (max-width: 600px) {
    .toast { left: 12px; right: 12px; bottom: 16px; font-size: 13px; }

  .tmdb-dropdown {
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;

    font-size: 13px;

  .sort-arrow { margin-left: 4px; font-size: 10px; }

  .film-strip-top {

        style: { padding: 32, color: '#fff', background: '#1a0010', fontFamily: 'monospace', fontSize: 14, whiteSpace: 'pre-wrap' }
      }, '🎬 Bo\'s Content List ran into an error:\n\n' + String(this.state.error));
    }
    return this.props.children;
  }
}

// Fetch streaming providers for a TMDB id+type, returns our network label or null
async function fetchProviders(tmdbId, type) {
  if (!TMDB_API_KEY || !tmdbId) return null;
  try {
    const mediaType = type === 'movie' ? 'movie' : 'tv';
    const res = await fetch(
      `https://api.themoviedb.org/3/${mediaType}/${tmdbId}/watch/providers?api_key=${TMDB_API_KEY}`
    );
    const data = await res.json();
    const us = data.results?.US;
    const flatrate = us?.flatrate || [];
    // Find first provider we recognise, prefer MY_SUBS
    const all = flatrate.map(p => PROVIDER_MAP[p.provider_name]).filter(Boolean);
    const subMatch = all.find(n => MY_SUBS.includes(n));
    return subMatch || all[0] || null;
  } catch(e) { return null; }
}

function StarIcon({ fill = 'empty', size = 14 }) {
  const color = fill === 'empty' ? 'var(--star-empty)' : 'var(--star-filled)';
  if (fill === 'half') {
    return (
      <svg width={size} height={size} viewBox="0 0 24 24">
        <defs>
          <linearGradient id="halfGrad">
            <stop offset="50%" stopColor="var(--star-filled)" />
            <stop offset="50%" stopColor="var(--star-empty)" />
          </linearGradient>
        </defs>
        <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"
          fill="url(#halfGrad)" />
      </svg>
    );
  }
  return (
    <svg width={size} height={size} viewBox="0 0 24 24">
      <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"
        fill={color} />
    </svg>
  );
}

function StarRating({ rating, size = 14 }) {
  if (!rating) return <span style={{color:'var(--text-muted)', fontSize: 11}}>—</span>;
  const stars = [];
  for (let i = 1; i <= 5; i++) {
    if (rating >= i) stars.push(<StarIcon key={i} fill="full" size={size} />);
    else if (rating >= i - 0.5) stars.push(<StarIcon key={i} fill="half" size={size} />);
    else stars.push(<StarIcon key={i} fill="empty" size={size} />);
  }
  return <span className="stars">{stars}</span>;
}

function StarRatingInput({ value, onChange }) {
  const [hover, setHover] = useState(0);

  const handleClick = (starIndex, isHalf) => {
    const newVal = isHalf ? starIndex - 0.5 : starIndex;
    onChange(newVal === value ? 0 : newVal);
  };

  return (
    <div className="rating-input">
      {[1,2,3,4,5].map(i => {
        const displayVal = hover || value;
        let fill = 'empty';
        if (displayVal >= i) fill = 'full';
        else if (displayVal >= i - 0.5) fill = 'half';

        return (
          <div key={i} style={{position:'relative', cursor:'pointer', width: 28, height: 28}}
            onMouseLeave={() => setHover(0)}>
            <div style={{position:'absolute', left:0, top:0, width:'50%', height:'100%', zIndex:2}}
              onMouseEnter={() => setHover(i - 0.5)}
              onClick={() => handleClick(i, true)} />
            <div style={{position:'absolute', right:0, top:0, width:'50%', height:'100%', zIndex:2}}
              onMouseEnter={() => setHover(i)}
              onClick={() => handleClick(i, false)} />
            <StarIcon fill={fill} size={24} />
          </div>
        );
      })}
      {value > 0 && (
        <span style={{marginLeft: 8, fontSize: 13, color: 'var(--text-secondary)'}}>
          {value}/5
        </span>
      )}
    </div>
  );
}

// ============ TMDB SEARCH ============
function useTMDBSearch() {
  const [results, setResults] = useState([]);
  const [loading, setLoading] = useState(false);
  const timeoutRef = useRef(null);

  const search = useCallback((query, type) => {
    if (!TMDB_API_KEY || !query || query.length < 2) {
      setResults([]);
      return;
    }
    clearTimeout(timeoutRef.current);
    timeoutRef.current = setTimeout(async () => {
      setLoading(true);
      try {
        const mediaType = type === 'movie' ? 'movie' : 'tv';
        const res = await fetch(
          `https://api.themoviedb.org/3/search/${mediaType}?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(query)}`
        );
        const data = await res.json();
        setResults((data.results || []).slice(0, 6));
      } catch(e) {
        setResults([]);
      }
      setLoading(false);
    }, 400);
  }, []);

  return { results, loading, search, clear: () => setResults([]) };
}

const formatDate = (date) => {
  return `${date.getMonth()+1}/${date.getDate()}/${date.getFullYear()} ${date.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',hour12:true}).toLowerCase()}`;
};

// ── Background poster + provider fetcher (fire-and-forget after save) ────────
async function autoFetchPoster(firestoreId, title, type) {
  if (!TMDB_API_KEY || !title || !firestoreId) return;
  try {
    const mediaType = type === 'movie' ? 'movie' : 'tv';
    const res = await fetch(
      `https://api.themoviedb.org/3/search/${mediaType}?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(title)}`
    );
    const data = await res.json();
    const result = data.results?.[0];
    if (!result) return;
    const updates = { tmdbId: result.id };
    if (result.overview) updates.overview = result.overview;
    if (result.poster_path) updates.posterUrl = TMDB_IMG_BASE + result.poster_path;
    const provider = await fetchProviders(result.id, type);
    if (provider) updates.network = provider;
    await db.collection('content').doc(firestoreId).update(updates);
  } catch(e) {}
}

function useDataStore() {
  const [items, setItems] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [importing, setImporting] = useState(false);

  useEffect(() => {
    const unsubscribe = db.collection('content')
      .orderBy('title')
      .onSnapshot(snapshot => {
        const data = snapshot.docs.map(doc => ({ ...doc.data(), firestoreId: doc.id }));
        setItems(data);
        setLoaded(true);
      }, err => {
        console.error('Firestore error:', err);
        setLoaded(true);
      });
    return unsubscribe;
  }, []);


  const addItem = useCallback(async (item) => {
    const now = new Date();
    const newItem = {
      ...item,
      id: Date.now(),
      ratedDate: item.rating > 0 ? formatDate(now) : '',
      posterUrl: item.posterUrl || '',
      noPoster: item.noPoster || false,
    };
    const docRef = await db.collection('content').add(newItem);
    // Auto-fetch poster in background if none set and not flagged to skip
    if (!newItem.posterUrl && !newItem.noPoster) {
      autoFetchPoster(docRef.id, item.title, item.type);
    }
    return { id: newItem.id, firestoreId: docRef.id };
  }, []);

  const updateItem = useCallback(async (id, updates) => {
    const item = items.find(i => i.id === id);
    if (!item?.firestoreId) return;
    const updated = { ...updates };
    if (updates.rating !== undefined && updates.rating !== item.rating && updates.rating > 0) {
      updated.ratedDate = formatDate(new Date());
    }
    await db.collection('content').doc(item.firestoreId).update(updated);
  }, [items]);

  const deleteItem = useCallback(async (id) => {
    const item = items.find(i => i.id === id);
    if (!item?.firestoreId) return;
    await db.collection('content').doc(item.firestoreId).delete();
  }, [items]);

  const importInitialData = useCallback(async () => {
    setImporting(true);
    try {
      const batchSize = 400;
      for (let i = 0; i < INITIAL_DATA.length; i += batchSize) {
        const batch = db.batch();
        INITIAL_DATA.slice(i, i + batchSize).forEach(item => {
          batch.set(db.collection('content').doc(), item);
        });
        await batch.commit();
      }
    } catch(e) {
      console.error('Import error:', e);
    }
    setImporting(false);
  }, []);

  return { items, loaded, importing, addItem, updateItem, deleteItem, importInitialData };
}

  const [form, setForm] = useState(item ? { ...defaults, ...item } : defaults);
  const tmdb = useTMDBSearch();
  const [showTMDB, setShowTMDB] = useState(false);
  const [tmdbSeasons, setTmdbSeasons] = useState([]);
  const [loadingSeasons, setLoadingSeasons] = useState(false);
  const titleRef = useRef(null);

  const set = (field, value) => setForm(prev => ({ ...prev, [field]: value }));

  // On open, if TV show with a tmdbId (edit OR add-with-prefill), pre-load seasons
  useEffect(() => {
    if (item?.tmdbId && item?.type !== 'movie') {
      setLoadingSeasons(true);
      fetch(`https://api.themoviedb.org/3/tv/${item.tmdbId}?api_key=${TMDB_API_KEY}`)
        .then(r => r.json())
        .then(d => {
          const seasons = (d.seasons || []).filter(s => s.season_number > 0);
          setTmdbSeasons(seasons);
        })
        .catch(() => {})
        .finally(() => setLoadingSeasons(false));
    }

  const handleTitleChange = (e) => {
    const val = e.target.value;
    set('title', val);
    if (val.length >= 2) {
      tmdb.search(val, form.type);
      setShowTMDB(true);
    } else {
      setShowTMDB(false);
    }

  const selectTMDB = async (result) => {
    const title = result.title || result.name || '';
    const posterPath = result.poster_path ? TMDB_IMG_BASE + result.poster_path : '';
    const releaseDate = result.release_date || result.first_air_date || '';

    set('posterUrl', posterPath);
    set('tmdbId', result.id);
    if (releaseDate) set('releaseDate', releaseDate);
    if (result.overview) set('overview', result.overview);
    setShowTMDB(false);
    tmdb.clear();
    // Auto-fill network from watch providers

    if (provider) set('network', provider);
    // For TV shows, fetch seasons list

    if (mediaType === 'tv') {

        const tvData = await tvRes.json();

// Compact star rating for inline table editing
function InlineStarRating({ value, onChange }) {
  return (
    <div className="inline-star" onClick={e => e.stopPropagation()}>
      {[1,2,3,4,5].map(i => (
        <div key={i} style={{position:'relative',width:14,height:14}}>
          <div style={{position:'absolute',left:0,top:0,width:'50%',height:'100%',zIndex:2}}
            onClick={() => onChange(i-0.5 === value ? 0 : i-0.5)} />
          <div style={{position:'absolute',right:0,top:0,width:'50%',height:'100%',zIndex:2}}
            onClick={() => onChange(i === value ? 0 : i)} />
          <StarIcon fill={value >= i ? 'full' : value >= i-0.5 ? 'half' : 'empty'} size={14} />
        </div>
      ))}
    </div>
  );
}

function ContentTableRow({ item, onClick, inlineEdit, setInlineEdit, onUpdate, isReadOnly = false }) {
  const editing = (field) => !isReadOnly && inlineEdit?.id === item.id && inlineEdit?.field === field;
  const startEdit = (e, field) => { if (isReadOnly) return; e.stopPropagation(); setInlineEdit({ id: item.id, field }); };
  const save = (field, value) => { onUpdate(item.id, { [field]: value }); setInlineEdit(null); };
  const cancel = () => setInlineEdit(null);
  return (
    <tr style={{cursor:'pointer'}} onClick={() => { if (!inlineEdit) onClick(item); }}>
      <td onClick={(e) => { e.stopPropagation(); onClick(item); }}>
        <div style={{display:'flex', alignItems:'center'}}>
          {item.posterUrl && <img src={item.posterUrl} className="table-poster-thumb" alt="" loading="lazy" />}
          <span className="table-row-title">{item.title}</span>
        </div>
      </td>
      {/* Status */}
      <td onClick={(e) => startEdit(e, 'status')}>
        {editing('status') ? (
          <select autoFocus className="inline-select" value={item.status}
            onChange={e => save('status', e.target.value)}
            onBlur={cancel} onClick={e => e.stopPropagation()}>
            {STATUS_OPTIONS.map(o => <option key={o.value} value={o.value}>{o.label}</option>)}
          </select>
        ) : <span className={`tag ${getStatusTagClass(item.status)} editable-cell`}>{getStatusLabel(item.status)}</span>}
      </td>
      {/* Priority */}
      <td style={{textAlign:'center'}} onClick={(e) => startEdit(e, 'priority')}>
        {editing('priority') ? (
          <select autoFocus className="inline-select" value={item.priority}
            onChange={e => save('priority', e.target.value)}
            onBlur={cancel} onClick={e => e.stopPropagation()}>
            {PRIORITY_OPTIONS.map(p => <option key={p} value={p}>{p}</option>)}
          </select>
        ) : <span className="editable-cell">{item.priority !== '' && item.priority !== 'n/a' ? item.priority : '—'}</span>}
      </td>
      <td>{getTypeEmoji(item.type)}</td>
      {/* Season */}
      <td onClick={(e) => startEdit(e, 'season')}>
        {editing('season') ? (
          <input autoFocus className="inline-input" defaultValue={item.season || ''}
            onBlur={e => save('season', e.target.value)}
            onKeyDown={e => { if (e.key==='Enter') save('season', e.target.value); if (e.key==='Escape') cancel(); }}
            onClick={e => e.stopPropagation()} />
        ) : <span className="editable-cell">{item.season || '—'}</span>}
      </td>
      {/* Who */}
      <td onClick={(e) => startEdit(e, 'who')}>
        {editing('who') ? (
          <select autoFocus className="inline-select" value={item.who}
            onChange={e => save('who', e.target.value)}
            onBlur={cancel} onClick={e => e.stopPropagation()}>
            {WHO_OPTIONS.map(o => <option key={o.value} value={o.value}>{o.label}</option>)}
          </select>
        ) : <span className="editable-cell">{getWhoEmoji(item.who)}</span>}
      </td>
      {/* Network */}
      <td onClick={(e) => startEdit(e, 'network')}>
        {editing('network') ? (
          <select autoFocus className="inline-select" value={item.network || ''}
            onChange={e => save('network', e.target.value)}
            onBlur={cancel} onClick={e => e.stopPropagation()}>
            <option value="">—</option>
            {NETWORK_OPTIONS.map(n => <option key={n} value={n}>{n}</option>)}
          </select>
        ) : <span className="editable-cell card-network">{item.network || '—'}</span>}
      </td>
      {/* Rating — always interactive */}
      <td><InlineStarRating value={item.rating} onChange={val => onUpdate(item.id, {rating: val})} /></td>
      {/* Release Date */}
      <td onClick={(e) => startEdit(e, 'releaseDate')}>
        {editing('releaseDate') ? (
          <input autoFocus className="inline-input" type="date"
            defaultValue={item.releaseDate ? item.releaseDate.split('T')[0] : ''}
            onBlur={e => save('releaseDate', e.target.value)}
            onKeyDown={e => { if (e.key==='Enter') save('releaseDate', e.target.value); if (e.key==='Escape') cancel(); }}
            onClick={e => e.stopPropagation()} />
        ) : (
          <span className="editable-cell" style={{fontSize:11,color:'var(--text-muted)',whiteSpace:'nowrap'}}>
            {item.releaseDate ? (() => {
              const s = item.releaseDate;
              if (s.includes('-')) { const p = s.split('T')[0].split('-'); if (p.length >= 3) { const y = parseInt(p[0]), m = parseInt(p[1]), d = parseInt(p[2]); if (!isNaN(y) && !isNaN(m) && !isNaN(d)) return `${m}/${d}/${y}`; } }
              if (s.includes('/')) { const p = s.split('/'); const m = parseInt(p[0]), d = parseInt(p[1]), y = parseInt(p[2]); if (!isNaN(m) && !isNaN(d) && !isNaN(y)) return `${m}/${d}/${y}`; }
              return s;
            })() : ''}
          </span>
        )}
      </td>
      {/* Rated Date */}
      <td onClick={(e) => startEdit(e, 'ratedDate')}>
        {editing('ratedDate') ? (
          <input autoFocus className="inline-input" type="date"
            defaultValue={item.ratedDate ? (() => {
              const s = item.ratedDate;
              if (s.includes('-')) return s.split('T')[0];
              if (s.includes('/')) { const p = s.split('/'); const m = String(parseInt(p[0])).padStart(2,'0'), d = String(parseInt(p[1])).padStart(2,'0'), y = parseInt(p[2]); if (!isNaN(y)) return `${y}-${m}-${d}`; }
              return '';
            })() : ''}
            onBlur={e => save('ratedDate', e.target.value)}
            onKeyDown={e => { if (e.key==='Enter') save('ratedDate', e.target.value); if (e.key==='Escape') cancel(); }}
            onClick={e => e.stopPropagation()} />
        ) : (
          <span className="editable-cell" style={{fontSize:11,color:'var(--text-muted)',whiteSpace:'nowrap'}}>
            {item.ratedDate ? (() => {
              const s = item.ratedDate;
              if (s.includes('/')) { const p = s.split('/'); const m = parseInt(p[0]), d = parseInt(p[1]), y = parseInt(p[2]); if (!isNaN(m) && !isNaN(d) && !isNaN(y)) return `${m}/${d}/${y}`; }
              if (s.includes('-')) { const p = s.split('T')[0].split('-'); if (p.length >= 3) { const y = parseInt(p[0]), m = parseInt(p[1]), d = parseInt(p[2]); if (!isNaN(y) && !isNaN(m) && !isNaN(d)) return `${m}/${d}/${y}`; } }
              return s;
            })() : ''}
          </span>
        )}
      </td>
      {/* Non-Free — click to toggle */}
      <td onClick={(e) => { e.stopPropagation(); onUpdate(item.id, {nonFree: !item.nonFree}); }}
        style={{cursor:'pointer', textAlign:'center'}}>
        {item.nonFree ? <span className="tag tag-nonfree">$</span> : <span style={{color:'var(--text-muted)'}}>—</span>}
      </td>
    </tr>
  );
}

// ── Auth Wrapper ──
function AuthWrapper({ children }) {
  const [user, setUser] = useState(null);
  const [authLoading, setAuthLoading] = useState(true);
  const [denied, setDenied] = useState(false);

  useEffect(() => {
    const unsubscribe = auth.onAuthStateChanged(u => {
      if (u) {
        if (ALLOWED_EMAILS.includes(u.email) || READ_ONLY_EMAILS.includes(u.email)) {
          setUser(u);
          setDenied(false);
        } else {
          auth.signOut();
          setDenied(true);
          setUser(null);
        }
      } else {
        setUser(null);
      }
      setAuthLoading(false);
    });
    return unsubscribe;
  }, []);

  const signIn = () => {
    const provider = new firebase.auth.GoogleAuthProvider();
    auth.signInWithPopup(provider);
  };

  const signOut = () => auth.signOut();

  if (authLoading) {
    return (
      <div style={{display:'flex',alignItems:'center',justifyContent:'center',
        height:'100vh',fontSize:24,color:'var(--text-primary)'}}>
        🎬 Loading...
      </div>
    );
  }

  if (!user) return <LoginScreen onSignIn={signIn} denied={denied} />;

  const isReadOnly = READ_ONLY_EMAILS.includes(user.email);
  return React.cloneElement(children, { user, onSignOut: signOut, isReadOnly });
}
