  const fetchAllPosters = useCallback(async () => {
    const missing = items.filter(i => !i.posterUrl && i.title && i.firestoreId);
    if (!missing.length) { showToast('✅ All items already have posters!'); return; }
    setPosterProgress({ done: 0, total: missing.length });
    let done = 0;
    const batchSize = 5;
    for (let i = 0; i < missing.length; i += batchSize) {
      const batch = missing.slice(i, i + batchSize);
      await Promise.all(batch.map(async (item) => {
        try {
          const mediaType = item.type === 'movie' ? 'movie' : 'tv';
          const res = await fetch(
            `https://api.themoviedb.org/3/search/${mediaType}?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(item.title)}`
          );
          const data = await res.json();
          const result = data.results?.[0];
          if (result?.poster_path) {
            await db.collection('content').doc(item.firestoreId).update({
              posterUrl: TMDB_IMG_BASE + result.poster_path
            });
          }
        } catch(e) {}
        done++;
        setPosterProgress({ done, total: missing.length });
      }));
      // Rate limit: pause between batches
      if (i + batchSize < missing.length) {
        await new Promise(r => setTimeout(r, 500));
      }
    }
    setPosterProgress(null);
    showToast('🎨 Poster fetch complete!');
  }, [items]);

  const fetchAllPlatforms = useCallback(async () => {
    const toFetch = items.filter(i => i.firestoreId && i.title);
    if (!toFetch.length) { showToast('Nothing to fetch.'); return; }
    setPlatformProgress({ done: 0, total: toFetch.length });
    let done = 0;
    const batchSize = 5;
    for (let i = 0; i < toFetch.length; i += batchSize) {
      const batch = toFetch.slice(i, i + batchSize);
      await Promise.all(batch.map(async (item) => {
        try {
          // Search TMDB to get the ID if we don't have it
          let tmdbId = item.tmdbId;
          if (!tmdbId) {
            const mediaType = item.type === 'movie' ? 'movie' : 'tv';
            const res = await fetch(
              `https://api.themoviedb.org/3/search/${mediaType}?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(item.title)}`
            );
            const data = await res.json();
            tmdbId = data.results?.[0]?.id;
          }
          if (tmdbId) {
            const provider = await fetchProviders(tmdbId, item.type);
            if (provider) {
              await db.collection('content').doc(item.firestoreId).update({ network: provider, tmdbId });
            }
          }
        } catch(e) {}
        done++;
        setPlatformProgress({ done, total: toFetch.length });
      }));
      if (i + batchSize < toFetch.length) await new Promise(r => setTimeout(r, 600));
    }
    setPlatformProgress(null);
    showToast('📡 Platform data updated!');
  }, [items]);

  const fetchAllDescriptions = useCallback(async () => {
    const toFetch = items.filter(i => i.firestoreId && i.title && !i.overview);
    if (!toFetch.length) { showToast('✅ All items already have descriptions!'); return; }
    setDescProgress({ done: 0, total: toFetch.length });
    let done = 0;
    const batchSize = 4;
    for (let i = 0; i < toFetch.length; i += batchSize) {
      const batch = toFetch.slice(i, i + batchSize);
      await Promise.all(batch.map(async (item) => {
        try {
          const mediaType = item.type === 'movie' ? 'movie' : 'tv';
          let tmdbId = item.tmdbId;
          // Search for tmdbId if we don't have it
          if (!tmdbId) {
            const res = await fetch(`https://api.themoviedb.org/3/search/${mediaType}?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(item.title)}`);
            const data = await res.json();
            tmdbId = data.results?.[0]?.id;
          }
          if (tmdbId) {
            let overview = '';
            if (item.type === 'tv' && item.season) {
              // Try season-specific overview first
              const sRes = await fetch(`https://api.themoviedb.org/3/tv/${tmdbId}/season/${item.season}?api_key=${TMDB_API_KEY}`);
              const sData = await sRes.json();
              overview = sData.overview || '';
            }
            if (!overview) {
              // Fall back to show/movie level overview
              const mRes = await fetch(`https://api.themoviedb.org/3/${mediaType}/${tmdbId}?api_key=${TMDB_API_KEY}`);
              const mData = await mRes.json();
              overview = mData.overview || '';
            }
            if (overview) {
              const updates = { overview };
              if (!item.tmdbId && tmdbId) updates.tmdbId = tmdbId;
              await db.collection('content').doc(item.firestoreId).update(updates);
            }
          }
        } catch(e) {}
        done++;
        setDescProgress({ done, total: toFetch.length });
      }));
      if (i + batchSize < toFetch.length) await new Promise(r => setTimeout(r, 600));
    }
    setDescProgress(null);
    showToast('📖 Descriptions fetched!');
  }, [items]);

  const dismissRec = (key) => {
    setDismissedRecs(prev => {
      const next = new Set(prev);
      next.add(key);
      try { localStorage.setItem('dismissed_recs', JSON.stringify([...next])); } catch {}
      return next;
    });
  };
  const snoozeRec = (key) => {
    setSnoozedRecs(prev => {
      const next = { ...prev, [key]: Date.now() + 30 * 24 * 60 * 60 * 1000 };
      db.collection('settings').doc('rec_snooze').set(next).catch(() => {});
      return next;
    });
  };

  const fetchRecs = useCallback(async () => {
    if (!TMDB_API_KEY) return;
    setRecsLoading(true);
    const results = [];
    const now = new Date();

    // Build lookup maps
    const existingTmdbIds = new Set(items.map(i => i.tmdbId).filter(Boolean).map(String));
    const existingTitles = new Set(items.map(i => i.title.toLowerCase().trim()));

    // ── 1. UPCOMING SEASONS ──────────────────────────────────────────────
    // Group ALL tv shows by title (not just tmdbId — many items may lack it)
    const tvByTitle = {};
    items.filter(i => i.type === 'tv').forEach(i => {
      const key = i.title.toLowerCase().trim();
      if (!tvByTitle[key]) tvByTitle[key] = {
        title: i.title, tmdbId: i.tmdbId || null,
        posterUrl: i.posterUrl || '', seasons: new Set(), maxRating: 0, network: '',
        isWatched: false, isWatching: false,
      };
      if (i.tmdbId && !tvByTitle[key].tmdbId) tvByTitle[key].tmdbId = i.tmdbId;
      if (i.posterUrl && !tvByTitle[key].posterUrl) tvByTitle[key].posterUrl = i.posterUrl;
      if (i.network && !tvByTitle[key].network) tvByTitle[key].network = i.network;
      tvByTitle[key].seasons.add(parseInt(i.season) || 0);
      if (i.rating > tvByTitle[key].maxRating) tvByTitle[key].maxRating = i.rating;
      if ((i.ratedDate || '') > (tvByTitle[key].lastRatedDate || '')) tvByTitle[key].lastRatedDate = i.ratedDate || '';
      if (i.status === 'watched') tvByTitle[key].isWatched = true;
      if (i.status === 'watching') tvByTitle[key].isWatching = true;
    });

    // Only check shows with at least 1 real season tracked (season > 0)
    // Sort: watching first > watched > other; then by rating; then recency
    const tvShows = Object.values(tvByTitle)
      .filter(s => [...s.seasons].some(n => n > 0))
      .sort((a, b) => {
        const aStatus = a.isWatching ? 2 : a.isWatched ? 1 : 0;
        const bStatus = b.isWatching ? 2 : b.isWatched ? 1 : 0;
        if (bStatus !== aStatus) return bStatus - aStatus;
        if ((b.maxRating || 0) !== (a.maxRating || 0)) return (b.maxRating || 0) - (a.maxRating || 0);
        return (b.lastRatedDate || '').localeCompare(a.lastRatedDate || '');
      })
      .slice(0, 300); // check up to 300 shows

    // Fetch in small parallel batches
    const upcomingBatch = 8;
    for (let i = 0; i < tvShows.length; i += upcomingBatch) {
      await Promise.all(tvShows.slice(i, i + upcomingBatch).map(async (show) => {
        try {
          let tmdbId = show.tmdbId;
          if (!tmdbId) {
            const sr = await fetch(`https://api.themoviedb.org/3/search/tv?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(show.title)}`);
            const sd = await sr.json();
            tmdbId = sd.results?.[0]?.id;
          }
          if (!tmdbId) return;

          const res = await fetch(`https://api.themoviedb.org/3/tv/${tmdbId}?api_key=${TMDB_API_KEY}`);
          const data = await res.json();

          const trackedSeasons = [...show.seasons].filter(n => n > 0);
          const maxTracked = Math.max(...trackedSeasons);

          // Check if TMDB has an announced next season
          const nextNum = maxTracked + 1;
          const allSeasons = (data.seasons || []).filter(s => s.season_number > 0);
          const nextSeason = allSeasons.find(s => s.season_number === nextNum);

          let airDateStr = nextSeason?.air_date || null;
          // Fall back to next_episode_to_air on the show
          if (!airDateStr && data.next_episode_to_air?.season_number === nextNum) {
            airDateStr = data.next_episode_to_air.air_date;
          }

          if (airDateStr) {
            const airDate = new Date(airDateStr);
            const daysUntil = Math.round((airDate - now) / 86400000);
            // Surface: up to 6 months future OR up to 1 year past (haven't added it yet)
            if (daysUntil > -365 && daysUntil < 180) {
              const alreadyAdded = show.seasons.has(nextNum);
              if (!alreadyAdded) {
                const posterUrl = nextSeason?.poster_path
                  ? TMDB_IMG_BASE + nextSeason.poster_path
                  : (data.poster_path ? TMDB_IMG_BASE + data.poster_path : show.posterUrl);
                const dateLabel = daysUntil < 0
                  ? `S${nextNum} out since ${new Date(airDateStr).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}`
                  : daysUntil === 0 ? `S${nextNum} drops today! 🎉`
                  : daysUntil <= 7 ? `S${nextNum} in ${daysUntil} days`
                  : `S${nextNum} · ${new Date(airDateStr).toLocaleDateString('en-US',{month:'short',day:'numeric',year:daysUntil>300?'numeric':undefined})}`;
                const prevMax = Math.max(...[...show.seasons].filter(n => n > 0));
                // Network: use saved value, or fall back to TMDB's first listed network
                const tmdbNetwork = data.networks?.[0]?.name || null;
                const platform = show.network || tmdbNetwork;
                results.push({
                  key: `upcoming_${tmdbId}_s${nextNum}`,
                  type: 'upcoming', title: show.title, season: nextNum,
                  tmdbId, mediaType: 'tv', posterUrl, airDate: airDateStr,
                  daysUntil, reason: dateLabel, platform: platform || null,
                  overview: nextSeason?.overview || data.overview || '',
                  because: `Because you watched S${prevMax}`,
                });
              }
            }
          }
        } catch(e) {}
      }));
    }

    // ── 2. SIMILAR CONTENT ───────────────────────────────────────────────
    // Seed from 4★+ rated items; dedupe aggressively
    const seeds = [...items]
      .filter(i => i.rating >= 3.5 && i.tmdbId)
      .sort((a, b) => b.rating - a.rating || (b.ratedDate||'').localeCompare(a.ratedDate||''))
      .slice(0, 20);

    // Score map: tmdbId → { rec, score, reasons[] }
    const recMap = new Map();

    await Promise.all(seeds.map(async (seed) => {
      try {
        const mt = seed.type === 'movie' ? 'movie' : 'tv';
        const [recRes, simRes] = await Promise.all([
          fetch(`https://api.themoviedb.org/3/${mt}/${seed.tmdbId}/recommendations?api_key=${TMDB_API_KEY}`),
          fetch(`https://api.themoviedb.org/3/${mt}/${seed.tmdbId}/similar?api_key=${TMDB_API_KEY}`),
        ]);
        const [recData, simData] = await Promise.all([recRes.json(), simRes.json()]);
        const allResults = [...(recData.results||[]), ...(simData.results||[])];
        allResults.forEach(r => {
          const rTitle = (r.name || r.title || '').trim();
          const rId = String(r.id);
          if (existingTmdbIds.has(rId)) return;
          if (existingTitles.has(rTitle.toLowerCase())) return;
          if (!r.poster_path) return;
          // Filter non-English content not already in the user's list
          if (r.original_language && r.original_language !== 'en') {
            if (!existingTitles.has(rTitle.toLowerCase())) return;
          }
          // Filter out obscure/old content: require meaningful vote count & recency
          if ((r.vote_count || 0) < 30) return;
          const airYear = parseInt((r.first_air_date || r.release_date || '2000').slice(0, 4));
          if (airYear < 2005) return;
          if (!recMap.has(rId)) {
            recMap.set(rId, {
              key: `similar_${rId}`, type: 'similar',
              title: rTitle, tmdbId: r.id, mediaType: mt,
              posterUrl: TMDB_IMG_BASE + r.poster_path,
              overview: r.overview || '', platform: null,
              score: 0, topSeed: seed, topRating: seed.rating,
            });
          }
          const entry = recMap.get(rId);
          entry.score += seed.rating;
          if (seed.rating > entry.topRating) { entry.topSeed = seed; entry.topRating = seed.rating; }
        });
      } catch(e) {}
    }));

    // Top 20 by score, deduplicated
    const similar = [...recMap.values()]
      .sort((a, b) => b.score - a.score)
      .slice(0, 20)
      .map(e => ({ ...e, reason: `Because you liked ${e.topSeed.title}`, because: `Because you liked ${e.topSeed.title}` }));

    results.push(...similar);

    // Initial sort: upcoming soonest, then similar by score
    results.sort((a, b) => {
      if (a.type === 'upcoming' && b.type !== 'upcoming') return -1;
      if (b.type === 'upcoming' && a.type !== 'upcoming') return 1;
      if (a.type === 'upcoming') return (a.daysUntil ?? 999) - (b.daysUntil ?? 999);
      return (b.score || 0) - (a.score || 0);
    });

    // Publish what we have so far
    setRecs([...results]);

    // ── 3. NEW ON YOUR PLATFORMS (TMDB discover by network) ──────────────
    // Pull recent releases from each of your subscribed platforms
    const sixMonthsAgo = new Date(now); sixMonthsAgo.setMonth(sixMonthsAgo.getMonth() - 6);
    const airFrom = sixMonthsAgo.toISOString().slice(0,10);
    const airTo = new Date(now.getTime() + 90*86400000).toISOString().slice(0,10); // up to 3 months ahead

    const newOnPlatform = [];
    for (const sub of MY_SUBS) {
      const networkIds = MY_SUBS_TMDB_IDS[sub] || [];
      for (const netId of networkIds) {
        try {
          const res = await fetch(
            `https://api.themoviedb.org/3/discover/tv?api_key=${TMDB_API_KEY}` +
            `&with_networks=${netId}&first_air_date.gte=${airFrom}&first_air_date.lte=${airTo}` +
            `&sort_by=first_air_date.desc&vote_count.gte=5&page=1`
          );
          const data = await res.json();
          (data.results || []).forEach(r => {
            const rTitle = (r.name || '').trim();
            const rId = String(r.id);
            if (existingTmdbIds.has(rId)) return;
            if (existingTitles.has(rTitle.toLowerCase())) return;
            if (!r.poster_path) return;
            if (r.original_language && r.original_language !== 'en') return;
            if (results.some(x => String(x.tmdbId) === rId)) return; // already in similar list
            const airDate = new Date(r.first_air_date || airFrom);
            const daysAgo = Math.round((now - airDate) / 86400000);
            const daysUntil = -daysAgo;
            const simMatch = recMap.get(rId);
            newOnPlatform.push({
              key: `new_${rId}`,
              type: 'new',
              title: rTitle, tmdbId: r.id, mediaType: 'tv',
              posterUrl: TMDB_IMG_BASE + r.poster_path,
              overview: r.overview || '', platform: sub,
              airDate: r.first_air_date, daysUntil,
              score: r.vote_average || 0,
              reason: daysUntil >= 0
                ? `Out ${new Date(r.first_air_date).toLocaleDateString('en-US',{month:'short',day:'numeric'})}`
                : `Premiered ${Math.abs(daysUntil)}d ago`,
              because: simMatch ? `Because you liked ${simMatch.topSeed.title}` : null,
            });
          });
        } catch(e) {}
        await new Promise(r => setTimeout(r, 200)); // gentle rate limit
      }
    }

    // Dedupe new-on-platform by tmdbId, keep best (lowest daysUntil absolute)
    const newMap = new Map();
    newOnPlatform.forEach(r => {
      if (!newMap.has(r.tmdbId) || Math.abs(r.daysUntil) < Math.abs(newMap.get(r.tmdbId).daysUntil)) {
        newMap.set(r.tmdbId, r);
      }
    });
    results.push(...[...newMap.values()]);

    // ── 4. PLATFORM ENRICHMENT for similar recs ──────────────────────────
    const platformBatch = 6;
    const simResults = results.filter(r => r.type === 'similar');
    for (let i = 0; i < simResults.length; i += platformBatch) {
      await Promise.all(simResults.slice(i, i + platformBatch).map(async (rec) => {
        try {
          const p = await fetchProviders(rec.tmdbId, rec.mediaType === 'movie' ? 'movie' : 'tv');
          rec.platform = p || null;
        } catch(e) {}
      }));
    }

    // ── FINAL SORT ────────────────────────────────────────────────────────
    // 1. Upcoming seasons (soonest first)
    // 2. New on your platforms (soonest/most recent first)
    // 3. Similar on your subs (by score)
    // 4. Similar elsewhere (by score)
    const typeOrder = (r) => {
      if (r.type === 'upcoming') return 0;
      if (r.type === 'new') return 1;
      if (r.type === 'similar' && MY_SUBS.includes(r.platform)) return 2;
      return 3;
    };
    // Drop 'new' cards that have no genuine similarity connection — don't recommend just because it's on a platform
    const filtered = results.filter(r => r.type !== 'new' || r.because);

    filtered.sort((a, b) => {
      const ta = typeOrder(a), tb = typeOrder(b);
      if (ta !== tb) return ta - tb;
      if (a.type === 'upcoming') return (a.daysUntil ?? 999) - (b.daysUntil ?? 999);
      if (a.type === 'new') return Math.abs(a.daysUntil ?? 999) - Math.abs(b.daysUntil ?? 999);
      return (b.score || 0) - (a.score || 0);
    });

    setRecs([...filtered]);
    setRecsLoading(false);
  }, [items]);

  // Auto-fetch recs on mount (banner defaults open)
  useEffect(() => {
    if (loaded && recs === null && !recsLoading) fetchRecs();
  }, [loaded]); // eslint-disable-line react-hooks/exhaustive-deps

  // Open recs and fetch if needed
  const toggleRecs = () => {
    setShowRecs(prev => {
      if (!prev && recs === null) fetchRecs();
      return !prev;
    });
  };

  // Toast helper — showToast(msg) or showToast(msg, { onUndo: fn, duration: ms })
  const showToast = (msg, options = {}) => {
    if (toastTimerRef.current) clearTimeout(toastTimerRef.current);
    setToast({ msg, onUndo: options.onUndo || null });
    toastTimerRef.current = setTimeout(() => setToast(null), options.duration || 4000);
  };
  const dismissToast = () => { if (toastTimerRef.current) clearTimeout(toastTimerRef.current); setToast(null); };

  // Filtering
  const filtered = useMemo(() => {
    let result = [...items];

    if (search) {
      const q = search.toLowerCase();
      result = result.filter(i => i.title.toLowerCase().includes(q) ||
        (i.network && i.network.toLowerCase().includes(q)));
    }

    if (filterStatus !== 'all') {
      if (filterStatus === 'unwatched') {
        result = result.filter(i => i.status !== 'watched' && i.status !== 'dont_watch');
      } else if (filterStatus === 'watching') {
        result = result.filter(i => i.status.startsWith('watching'));
      } else {
        result = result.filter(i => i.status === filterStatus);
      }
    }

    if (filterType !== 'all') result = result.filter(i => i.type === filterType);
    if (filterWho !== 'all') result = result.filter(i => i.who === filterWho);
    if (filterNetworks.length > 0) result = result.filter(i => filterNetworks.includes(i.network));

    if (filterRating !== 'all') {
      const r = parseFloat(filterRating);
      result = result.filter(i => i.rating === r);
    }

    // Status sort order: watching > watching_airing > watching_gap > want_to_watch > watched > dont_watch
    const STATUS_ORDER = {
      'watching': 0,
      'watching_airing': 1,
      'watching_gap': 2,
      'want_to_watch': 3,
      'watched': 4,
      'dont_watch': 5,
    };
        // Sort
    result.sort((a, b) => {
      let cmp = 0;
      if (sortBy === 'status') cmp = (STATUS_ORDER[a.status] ?? 99) - (STATUS_ORDER[b.status] ?? 99);
      else if (sortBy === 'title') cmp = a.title.localeCompare(b.title);
      else if (sortBy === 'priority') {
        const pa = a.priority === '-' || a.priority === 'n/a' || !a.priority ? 99 : parseInt(a.priority);
        const pb = b.priority === '-' || b.priority === 'n/a' || !b.priority ? 99 : parseInt(b.priority);
        cmp = pa - pb;
      }
      else if (sortBy === 'rating') cmp = (b.rating || 0) - (a.rating || 0);
      else if (sortBy === 'ratedDate') {
        const da = a.ratedDate ? new Date(a.ratedDate) : new Date(0);
        const db = b.ratedDate ? new Date(b.ratedDate) : new Date(0);
        cmp = db - da;
      }
      else if (sortBy === 'releaseDate') {
        const da = a.releaseDate ? new Date(a.releaseDate) : new Date(0);
        const db = b.releaseDate ? new Date(b.releaseDate) : new Date(0);
        cmp = db - da;
      }
      else if (sortBy === 'network') cmp = (a.network || '').localeCompare(b.network || '');
      return sortDir === 'asc' ? cmp : -cmp;
    });

    return result;
  }, [items, search, filterStatus, filterType, filterWho, filterNetworks, filterRating, sortBy, sortDir]);

  const displayed = filtered.slice(0, displayCount);

  // Group by title for table view
  const tableRows = useMemo(() => {
    // When text-searching, show every item individually (no collapsing)
    if (search.trim()) {
      return filtered.slice(0, displayCount + 200).map(item => ({ _type: 'item', ...item }));
    }
    const groups = new Map();
    filtered.forEach(item => {
      const key = item.title.toLowerCase().trim();
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(item);
    });
    const result = [];
    const seen = new Set();
    filtered.forEach(item => {
      const key = item.title.toLowerCase().trim();
      if (seen.has(key)) return;
      seen.add(key);
      const group = groups.get(key);
      if (group.length === 1) {
        result.push({ _type: 'item', ...group[0] });
      } else {
        const rated = group.filter(i => i.rating > 0);
        const avg = rated.length ? Math.round(rated.reduce((s,i) => s+i.rating,0)/rated.length*2)/2 : 0;
        result.push({ _type: 'group', _key: key, _items: group, _avgRating: avg, ...group[0] });
        if (expandedGroups.has(key)) {
          const CHILD_STATUS_ORDER = {'watching':0,'watching_airing':1,'watching_gap':2,'want_to_watch':3,'watched':4,'dont_watch':5};
          const sorted = [...group].sort((a, b) => {
            const sa = CHILD_STATUS_ORDER[a.status] ?? 99;
            const sb = CHILD_STATUS_ORDER[b.status] ?? 99;
            if (sa !== sb) return sa - sb;
            // Same status → most recently rated first
            const da = a.ratedDate ? new Date(a.ratedDate) : new Date(0);
            const db = b.ratedDate ? new Date(b.ratedDate) : new Date(0);
            return db - da;
          });
          sorted.forEach(i => result.push({ _type: 'child', _groupKey: key, ...i }));
        }
      }
    });
    return result.slice(0, displayCount + (expandedGroups.size * 20));
  }, [filtered, expandedGroups, displayCount, search]);

  // Stats
  const stats = useMemo(() => {
    const total = items.length;
    const watched = items.filter(i => i.status === 'watched').length;
    const watching = items.filter(i => i.status.startsWith('watching')).length;
    const wantToWatch = items.filter(i => i.status === 'want_to_watch').length;
    const rated = items.filter(i => i.rating > 0).length;
    const avgRating = rated > 0 ? (items.reduce((sum, i) => sum + (i.rating || 0), 0) / rated).toFixed(1) : 0;
    return { total, watched, watching, wantToWatch, rated, avgRating };
  }, [items]);

  // Handlers
  const handleAdd = (formData) => {
    addItem(formData);
    if (pendingRecDismiss.current) { dismissRec(pendingRecDismiss.current); pendingRecDismiss.current = null; }
    showToast(`🎬 "${formData.title}" added to your list!`);
  };

  const handleEdit = (formData) => {
    updateItem(formData.id, formData);
    setEditItem(null);
    showToast(`✏️ "${formData.title}" updated!`);
  };

  const handleDelete = (id) => {
    const item = items.find(i => i.id === id);
    deleteItem(id);
    showToast(`🗑 "${item?.title}" removed.`);
  };

  const handleAddNextSeason = async (item) => {
    const nextSeason = (parseInt(item.season) || 0) + 1;
    const newItem = {
      title: item.title,
      type: item.type,
      season: String(nextSeason),
      status: 'want_to_watch',
      priority: item.priority || '',
      network: item.network || '',
      who: item.who || '',
      nonFree: item.nonFree || false,
      posterUrl: item.posterUrl || '',
      tmdbId: item.tmdbId || null,
      rating: 0,
      ratedDate: '',
      releaseDate: '',
      overview: '',
    };
    const { firestoreId } = await addItem(newItem);
    showToast(`✅ Added ${item.title} S${nextSeason}`, {
      onUndo: async () => {
        await db.collection('content').doc(firestoreId).delete();
      }
    });
  };

  const handleCardClick = (item) => {
    setDetailItem(item);
  };

  const handleSort = (field) => {
    if (sortBy === field) setSortDir(d => d === 'asc' ? 'desc' : 'asc');
    else {
      setSortBy(field);
      setSortDir('asc');
      // Auto-filter to Watched when sorting by rating (only watched items have ratings)
      if (field === 'rating') setFilterStatus('watched');
    }
  };

  const SortArrow = ({ field }) => {
    if (sortBy !== field) return null;
    return <span className="sort-arrow">{sortDir === 'asc' ? '▲' : '▼'}</span>;
  };

  if (!loaded) {
    return (
      <div style={{display:'flex',alignItems:'center',justifyContent:'center',height:'100vh',fontSize:24}}>
        <span>🎬 Loading...</span>
      </div>
    );
  }

  return (
    <>
      {/* Header */}
      <div className="header">
        <div className="header-inner">
          <div className="logo">
            <div className="logo-icon">🎬</div>
            <div>
              <div className="logo-text">BO'S CONTENT LIST</div>
              <div className="logo-sub">Track • Rate • Discover</div>
            </div>
          </div>

          <div className="search-bar">
            <span>🔍</span>
            <input placeholder="Search titles, networks..."
              value={search} onChange={e => {
                const v = e.target.value;
                setSearch(v);
                if (v && filterStatus === 'unwatched') setFilterStatus('all');
                if (!v) setFilterStatus('unwatched');
              }} />
            {search && <span style={{cursor:'pointer',color:'var(--text-muted)'}}
              onClick={() => { setSearch(''); setFilterStatus('unwatched'); }}>✕</span>}
          </div>

          <div style={{display:'flex',gap:8,alignItems:'center'}}>
            <div className="view-toggle">
              <button className={view === 'grid' ? 'active' : ''} onClick={() => setView('grid')}
                title="Grid view">▦</button>
              <button className={view === 'table' ? 'active' : ''} onClick={() => setView('table')}
                title="Table view">☰</button>
            </div>
            {!isReadOnly && (
              <button className="btn btn-primary" onClick={() => setShowForm(true)}>
                + Add
              </button>
            )}
            {/* Tools dropdown */}
            {TMDB_API_KEY && !isReadOnly && (
              <div className="tools-desktop-only" style={{position:'relative'}}>
                {(posterProgress || platformProgress || descProgress) ? (
                  <div style={{
                    display:'flex', alignItems:'center', gap:8,
                    background:'var(--bg-card)', border:'1px solid var(--border)',
                    borderRadius:8, padding:'6px 14px', fontSize:13
                  }}>
                    <span>{posterProgress ? '🎨' : descProgress ? '📖' : '📡'}</span>
                    <div style={{width:80, height:6, background:'var(--border)', borderRadius:3, overflow:'hidden'}}>
                      <div style={{
                        width: `${((posterProgress||platformProgress||descProgress).done/(posterProgress||platformProgress||descProgress).total*100).toFixed(0)}%`,
                        height:'100%', background:'var(--accent-gold)', borderRadius:3, transition:'width 0.3s'
                      }}/>
                    </div>
                    <span style={{color:'var(--text-muted)', fontSize:11}}>
                      {(posterProgress||platformProgress||descProgress).done}/{(posterProgress||platformProgress||descProgress).total}
                    </span>
                  </div>
                ) : (
                  <button className="btn btn-secondary" onClick={() => setShowToolsMenu(m => !m)}
                    style={{fontSize:13}}>
                    🛠 Tools ▾
                  </button>
                )}
                {showToolsMenu && !posterProgress && !platformProgress && !descProgress && (
                  <div style={{
                    position:'absolute', top:'calc(100% + 6px)', right:0,
                    background:'var(--bg-card)', border:'1px solid var(--border)',
                    borderRadius:10, padding:'6px', zIndex:50,
                    minWidth:200, boxShadow:'0 8px 24px rgba(0,0,0,0.4)'
                  }} onMouseLeave={() => setShowToolsMenu(false)}>
                    <div style={{padding:'6px 10px 4px', fontSize:10, color:'var(--text-muted)', textTransform:'uppercase', letterSpacing:1}}>
                      One-time fetches
                    </div>
                    <button className="btn btn-secondary" style={{width:'100%',textAlign:'left',borderRadius:6,marginBottom:4,fontSize:13}}
                      onClick={() => { setShowToolsMenu(false); fetchAllPosters(); }}>
                      🎨 Fetch missing posters
                    </button>
                    <button className="btn btn-secondary" style={{width:'100%',textAlign:'left',borderRadius:6,marginBottom:4,fontSize:13}}
                      onClick={() => { setShowToolsMenu(false); fetchAllPlatforms(); }}>
                      📡 Fetch streaming platforms
                    </button>
                    <button className="btn btn-secondary" style={{width:'100%',textAlign:'left',borderRadius:6,fontSize:13}}
                      onClick={() => { setShowToolsMenu(false); fetchAllDescriptions(); }}>
                      📖 Fetch missing descriptions
                    </button>
                    <div style={{height:1,background:'var(--border)',margin:'4px 0'}}/>
                    <button className='btn btn-secondary' style={{width:'100%',textAlign:'left',borderRadius:6,fontSize:13}}
                      onClick={() => { setShowToolsMenu(false); setShowDupesModal(true); }}>
                      🔍 Find duplicates
                    </button>
                  </div>
                )}
              </div>
            )}
            <div style={{display:'flex',alignItems:'center',gap:8,marginLeft:4}}>
              {user?.photoURL && (
                <img src={user.photoURL} alt={user.displayName}
                  style={{width:32,height:32,borderRadius:'50%',border:'2px solid var(--border)'}} />
              )}
              <button className="btn btn-secondary btn-sm" onClick={onSignOut}
                title="Sign out" style={{fontSize:12}}>Sign out</button>
            </div>
          </div>
        </div>
        </div>{/* header */}

      {/* First-time import banner */}
      {loaded && items.length === 0 && (
        <div style={{
          background: 'linear-gradient(90deg, #1a1a0a, #2a2a10)',
          borderBottom: '1px solid var(--accent-gold)',
          padding: '14px 24px', textAlign: 'center', color: 'var(--text-primary)'
        }}>
          <span style={{marginRight: 12}}>
            🎬 Your list is empty! You have <strong>{INITIAL_DATA.length}</strong> entries from Airtable ready to import.
          </span>
          <button className="btn btn-primary btn-sm" onClick={handleImport} disabled={importing}>
            {importing ? '⏳ Importing...' : 'Import all history'}
          </button>
        </div>
      )}

      {/* Stats */}
      <div className="stats-bar">
        <div className="stats-inner">
          <div className="stat clickable-stat" onClick={() => { setFilterStatus('all'); setFilterType('all'); setFilterWho('all'); setFilterNetworks([]); setFilterRating('all'); setSortBy('status'); setSortDir('asc'); setSearch(''); setDisplayCount(60); }}><span className="stat-num">{stats.total}</span> total</div>
          <div className="stat clickable-stat" onClick={() => { setFilterStatus('watched'); setFilterType('all'); setFilterWho('all'); setFilterNetworks([]); setFilterRating('all'); setSortBy('status'); setSortDir('asc'); setSearch(''); setDisplayCount(60); }}><span className="stat-num">{stats.watched}</span> watched</div>
          <div className="stat clickable-stat" onClick={() => { setFilterStatus('watching'); setFilterType('all'); setFilterWho('all'); setFilterNetworks([]); setFilterRating('all'); setSortBy('status'); setSortDir('asc'); setSearch(''); setDisplayCount(60); }}><span className="stat-num">{stats.watching}</span> watching</div>
          <div className="stat clickable-stat" onClick={() => { setFilterStatus('want_to_watch'); setFilterType('all'); setFilterWho('all'); setFilterNetworks([]); setFilterRating('all'); setSortBy('status'); setSortDir('asc'); setSearch(''); setDisplayCount(60); }}><span className="stat-num">{stats.wantToWatch}</span> to watch</div>
          <div className="stat clickable-stat" onClick={() => { setFilterStatus('watched'); setFilterType('all'); setFilterWho('all'); setFilterNetworks([]); setFilterRating('all'); setSortBy('rating'); setSortDir('desc'); setSearch(''); setDisplayCount(60); }}><span className="stat-num">{stats.rated}</span> rated</div>
          <div className="stat"><span className="stat-num">{stats.avgRating}</span> avg ⭐</div>
          <div className="stat" style={{marginLeft:'auto', color:'var(--text-muted)', fontSize: 11}}>
            Showing {Math.min(displayCount, filtered.length)} of {filtered.length}
          </div>
        </div>
      </div>

      {/* ── RECS PANEL ── */}
      {TMDB_API_KEY && (
        <div className="recs-bar">
          <div className="recs-toggle" onClick={toggleRecs}>
            <span className="recs-toggle-label">
              💡 Recommendations
              {recs !== null && !recsLoading && (() => {
                const visible = recs.filter(r => !dismissedRecs.has(r.key) && !(snoozedRecs[r.key] && snoozedRecs[r.key] > Date.now()));
                return visible.length > 0 ? <span className="recs-badge">{visible.length}</span> : null;
              })()}
              {recsLoading && <span style={{fontSize:12,color:'var(--accent-gold)',fontFamily:'Inter',fontWeight:400,letterSpacing:0}}>fetching…</span>}
            </span>
            <div style={{display:'flex',alignItems:'center',gap:10}}>
              {showRecs && dismissedRecs.size > 0 && (
                <span style={{fontSize:11,color:'var(--text-muted)',padding:'3px 8px',border:'1px solid var(--border)',borderRadius:6,background:'var(--bg-secondary)',cursor:'pointer'}}
                  onClick={(e) => { e.stopPropagation(); setShowRestorePanel(p => !p); }}>
                  ↩ Dismissed ({dismissedRecs.size})
                </span>
              )}
              {showRecs && recs !== null && !recsLoading && (
                <span style={{fontSize:11,color:'var(--text-muted)',padding:'3px 8px',border:'1px solid var(--border)',borderRadius:6,background:'var(--bg-secondary)',cursor:'pointer'}}
                  title="Re-fetches TMDB for new upcoming seasons & fresh recommendations"
                  onClick={(e) => { e.stopPropagation(); setRecs(null); setRecsVisible(10); fetchRecs(); }}>
                  🔄 Refresh
                </span>
              )}
              <span style={{fontSize:11,color:'var(--text-muted)'}}>{showRecs ? '▲ Hide' : '▼ Show'}</span>
            </div>
          </div>

          {showRecs && showRestorePanel && recs && dismissedRecs.size > 0 && (
            <div style={{margin:'0 0 10px 0',background:'var(--bg-secondary)',borderRadius:10,padding:'10px 12px',border:'1px solid var(--border)'}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
                <span style={{fontSize:12,fontWeight:700,color:'var(--text-primary)'}}>Dismissed recommendations</span>
                <span style={{fontSize:11,color:'var(--text-muted)',cursor:'pointer'}} onClick={() => setShowRestorePanel(false)}>✕</span>
              </div>
              <div style={{display:'flex',flexDirection:'column',gap:6}}>
                {recs.filter(r => dismissedRecs.has(r.key)).map(r => (
                  <div key={r.key} style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:8,padding:'5px 8px',background:'var(--bg-card)',borderRadius:7,border:'1px solid var(--border)'}}>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontSize:12,fontWeight:600,color:'var(--text-primary)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{r.title}{r.season ? ` S${r.season}` : ''}</div>
                      <div style={{fontSize:10,color:'var(--accent-gold)'}}>{r.because || r.reason}</div>
                    </div>
                    <button onClick={() => {
                      setDismissedRecs(prev => { const next = new Set(prev); next.delete(r.key); try { localStorage.setItem('dismissed_recs', JSON.stringify([...next])); } catch {} return next; });
                    }} style={{flexShrink:0,fontSize:11,padding:'3px 10px',borderRadius:6,border:'1px solid var(--accent-gold)',background:'transparent',color:'var(--accent-gold)',cursor:'pointer',fontWeight:600}}>
                      Restore
                    </button>
                  </div>
                ))}
                {recs.filter(r => dismissedRecs.has(r.key)).length === 0 && (
                  <div style={{fontSize:12,color:'var(--text-muted)'}}>Nothing left to restore.</div>
                )}
              </div>
            </div>
          )}

          {showRecs && (
            <div style={{paddingBottom:4}}>
              {recsLoading && (
                <div style={{padding:'12px 0',color:'var(--text-muted)',fontSize:13,display:'flex',alignItems:'center',gap:8}}>
                  <span style={{animation:'spin 1s linear infinite',display:'inline-block'}}>⏳</span>
                  Checking TMDB for upcoming seasons &amp; recommendations…
                </div>
              )}
              {recs !== null && (() => {
                const visible = recs.filter(r => !dismissedRecs.has(r.key) && !(snoozedRecs[r.key] && snoozedRecs[r.key] > Date.now()));
                if (!recsLoading && !visible.length) return <div className="recs-empty">✨ No new recs right now — check back after watching more!</div>;
                const page = visible.slice(0, recsVisible);
                const hasMore = visible.length > recsVisible;
                return (<>
                  <div className="recs-scroll">
                    {page.map(rec => {
                      const onMySub = MY_SUBS.includes(rec.platform);
                      const isExpanded = expandedRec === rec.key;
                      const badgeClass = rec.type === 'upcoming' ? 'rec-badge-upcoming' : rec.type === 'new' ? 'rec-badge-new' : 'rec-badge-similar';
                      const badgeLabel = rec.type === 'upcoming' ? '📅 NEW SEASON' : rec.type === 'new' ? '🆕 NEW' : '✨ FOR YOU';
                      return (
                        <div key={rec.key} className="rec-card">
                          <div className="rec-card-poster" style={{cursor: rec.overview ? 'pointer' : 'default'}}
                            onClick={() => rec.overview && setExpandedRec(isExpanded ? null : rec.key)}>
                            {rec.posterUrl
                              ? <img src={rec.posterUrl} alt={rec.title} loading="lazy" />
                              : <span style={{fontSize:32,opacity:0.3}}>{rec.mediaType === 'movie' ? '🎥' : '📺'}</span>
                            }
                            <span className={`rec-card-badge ${badgeClass}`}>{badgeLabel}</span>
                            {isExpanded && rec.overview && (
                              <div className="rec-desc-overlay" style={{overflowY:'auto'}}>
                                <div style={{fontWeight:600,fontSize:11,color:'var(--text-primary)',marginBottom:4}}>{rec.title}</div>
                                <div style={{fontSize:10,lineHeight:1.45,color:'var(--text-secondary)'}}>
                                  {rec.overview}
                                </div>
                                <div style={{marginTop:8,fontSize:9,color:'var(--accent-gold)',flexShrink:0}}>tap again to close</div>
                              </div>
                            )}
                            {rec.platform && !isExpanded && (
                              <span style={{position:'absolute',bottom:5,left:5,fontSize:9,fontWeight:700,padding:'2px 5px',borderRadius:4,
                                background: onMySub ? 'rgba(102,187,106,0.9)' : 'rgba(0,0,0,0.7)',
                                color: onMySub ? '#000' : '#aaa', backdropFilter:'blur(4px)'}}>
                                {rec.platform}
                              </span>
                            )}
                          </div>
                          <div className="rec-card-body">
                            <div className="rec-card-title">{rec.title}{rec.season ? ` S${rec.season}` : ''}</div>
                            <div className="rec-card-reason">
                              {rec.because || rec.reason}
                            </div>
                            <div className="rec-card-because">
                              {(rec.type !== 'similar' && rec.because) ? rec.reason : ''}
                            </div>
                            <div className="rec-card-actions">
                              <button className="rec-add-btn" style={{fontSize:14, opacity: isReadOnly ? 0.35 : 1, cursor: isReadOnly ? 'not-allowed' : 'pointer'}} onClick={() => {
                                if (isReadOnly) return;
                                const priorEntry = items.find(i => i.title.toLowerCase().trim() === rec.title.toLowerCase().trim());
                                setShowForm({
                                  title: rec.title,
                                  type: rec.mediaType === 'movie' ? 'movie' : 'tv',
                                  season: rec.season ? String(rec.season) : '',
                                  status: 'want_to_watch', priority: '1',
                                  network: rec.platform || priorEntry?.network || '', who: priorEntry?.who || 'together',
                                  nonFree: false, posterUrl: rec.posterUrl || '',
                                  tmdbId: rec.tmdbId || null, rating: 0,
                                  ratedDate: '', releaseDate: rec.airDate || '',
                                  overview: rec.overview || '',
                                });
                                pendingRecDismiss.current = rec.key;
                              }}>➕</button>
                              <button className="rec-dismiss-btn" title="Remind me later" style={{opacity: isReadOnly ? 0.35 : 1, cursor: isReadOnly ? 'not-allowed' : 'pointer'}} onClick={() => { if (isReadOnly) return; snoozeRec(rec.key); }}>💤</button>
                              <button className="rec-dismiss-btn" title="Never show again" style={{opacity: isReadOnly ? 0.35 : 1, cursor: isReadOnly ? 'not-allowed' : 'pointer'}} onClick={() => { if (isReadOnly) return; dismissRec(rec.key); }}>❌</button>
                            </div>
                          </div>
                        </div>
                      );
                    })}
                    {hasMore && (
                      <div style={{flexShrink:0,display:'flex',alignItems:'center',paddingRight:8}}>
                        <button className="btn btn-secondary" style={{fontSize:12,padding:'8px 14px',whiteSpace:'nowrap'}}
                          onClick={() => setRecsVisible(v => v + 10)}>
                          Show {Math.min(10, visible.length - recsVisible)} more →
                        </button>
                      </div>
                    )}
                  </div>
                </>);
              })()}
            </div>
          )}
        </div>
      )}

      {/* Filters */}
      <div className="filter-bar">
        {/* Mobile filter toggle */}
        <div className="filter-mobile-bar" onClick={() => setFiltersOpen(f => !f)}>
          <span style={{fontSize:13, fontWeight:600, color:'var(--text-secondary)'}}>
            🎛 Filters {(filterStatus!=='unwatched'||filterType!=='all'||filterWho!=='all'||filterNetworks.length>0||filterRating!=='all') && <span style={{color:'var(--accent-gold)'}}>●</span>}
          </span>
          <span style={{color:'var(--text-muted)', fontSize:12}}>{filtersOpen ? '▲ Hide' : '▼ Show'}</span>
        </div>
        <div className={`filter-inner-wrap ${filtersOpen ? 'open' : ''}`}>
          {/* ── DESKTOP: chip layout ── */}
          <div className="filter-inner filter-desktop-chips">
            <div className="filter-section">
              <span className="filter-label">Status</span>
              {[{v:'all',l:'All'},{v:'unwatched',l:'📋 Unwatched'},{v:'watched',l:'✅ Watched'},
                {v:'watching',l:'👀👀 Watching'},{v:'want_to_watch',l:'👀 Want'},{v:'dont_watch',l:'❌ Skip'}
              ].map(f => (
                <span key={f.v} className={`filter-chip ${filterStatus===f.v?'active':''}`}
                  onClick={() => { setFilterStatus(f.v); setDisplayCount(60); }}>{f.l}</span>
              ))}
            </div>
            <div className="filter-divider" />
            <div className="filter-section">
              <span className="filter-label">Type</span>
              <span className={`filter-chip ${filterType==='all'?'active':''}`}
                onClick={() => { setFilterType('all'); setDisplayCount(60); }}>All</span>
              {TYPE_OPTIONS.map(t => (
                <span key={t.value} className={`filter-chip ${filterType===t.value?'active':''}`}
                  onClick={() => { setFilterType(t.value); setDisplayCount(60); }}>{t.emoji}</span>
              ))}
            </div>
            <div className="filter-divider" />
            <div className="filter-section">
              <span className="filter-label">Who</span>
              <span className={`filter-chip ${filterWho==='all'?'active':''}`}
                onClick={() => { setFilterWho('all'); setDisplayCount(60); }}>All</span>
              {WHO_OPTIONS.map(w => (
                <span key={w.value} className={`filter-chip ${filterWho===w.value?'active':''}`}
                  onClick={() => { setFilterWho(w.value); setDisplayCount(60); }}>{w.emoji}</span>
              ))}
            </div>
            <div className="filter-divider" />
            <div className="filter-section">
              <span className="filter-label">Platform</span>
              {[...MY_SUBS, ...NETWORK_OPTIONS.filter(n => !MY_SUBS.includes(n)).sort()].map(n => (
                <span key={n} className={`filter-chip ${filterNetworks.includes(n) ? 'active' : ''}`}
                  onClick={() => { setFilterNetworks(prev => prev.includes(n) ? prev.filter(x => x !== n) : [...prev, n]); setDisplayCount(60); }}>
                  {n}
                </span>
              ))}
            </div>
            <div className="filter-divider" />
            <div className="filter-section">
              <span className="filter-label">Rating</span>
              <select value={filterRating} onChange={e => { setFilterRating(e.target.value); setDisplayCount(60); if (e.target.value !== 'all') setFilterStatus('watched'); }}
                style={{background: filterRating !== 'all' ? 'var(--accent-gold)' : 'var(--bg-secondary)', color: filterRating !== 'all' ? '#000' : 'var(--text-secondary)', border:'1px solid var(--border)', borderRadius:20, padding:'5px 12px', fontSize:12, fontWeight:600, cursor:'pointer', outline:'none'}}>
                <option value="all">All ratings</option>
                {[5,4.5,4,3.5,3,2.5,2,1.5,1,0.5].map(r => <option key={r} value={String(r)}>{r%1===0?'★'.repeat(r):'★'.repeat(Math.floor(r))+'½'} ({r})</option>)}
              </select>
            </div>
            <div className="filter-divider" />
            <div className="filter-section">
              <span className="filter-label">Sort</span>
              {[{v:'status',l:'Status'},{v:'title',l:'A-Z'},{v:'priority',l:'Priority'},{v:'rating',l:'Rating'},{v:'ratedDate',l:'Recent'}].map(s => (
                <span key={s.v} className={`filter-chip ${sortBy===s.v?'active':''}`}
                  onClick={() => handleSort(s.v)}>{s.l} {sortBy===s.v && (sortDir==='asc'?'↑':'↓')}</span>
              ))}
            </div>
            {(filterStatus !== 'unwatched' || filterType !== 'all' || filterWho !== 'all' || filterNetworks.length > 0 || filterRating !== 'all' || search || sortBy !== 'status') && (
              <><div className="filter-divider" />
              <span className="filter-chip" style={{borderColor:'var(--accent-red)',color:'#ef5350',whiteSpace:'nowrap'}}
                onClick={() => { setFilterStatus('unwatched'); setFilterType('all'); setFilterWho('all'); setFilterNetworks([]); setFilterRating('all'); setSortBy('status'); setSortDir('asc'); setSearch(''); setDisplayCount(60); }}>
                ✕ Clear filters
              </span></>
            )}
          </div>

          {/* ── MOBILE: dropdown layout ── */}
          <div className="filter-mobile-dropdowns" style={{padding:'8px 0'}}>
            <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:8, marginBottom:8}}>
              <div>
                <div className="filter-mobile-label">Status</div>
                <select className={`filter-mobile-select ${filterStatus!=='unwatched'?'active':''}`} value={filterStatus}
                  onChange={e => { setFilterStatus(e.target.value); setDisplayCount(60); }}>
                  {[{v:'unwatched',l:'📋 Unwatched'},{v:'all',l:'All'},{v:'watched',l:'✅ Watched'},
                    {v:'watching',l:'👀 Watching'},{v:'want_to_watch',l:'👀 Want'},{v:'dont_watch',l:'❌ Skip'}
                  ].map(f => <option key={f.v} value={f.v}>{f.l}</option>)}
                </select>
              </div>
              <div>
                <div className="filter-mobile-label">Type</div>
                <select className={`filter-mobile-select ${filterType!=='all'?'active':''}`} value={filterType}
                  onChange={e => { setFilterType(e.target.value); setDisplayCount(60); }}>
                  <option value="all">All types</option>
                  {TYPE_OPTIONS.map(t => <option key={t.value} value={t.value}>{t.label}</option>)}
                </select>
              </div>
              <div>
                <div className="filter-mobile-label">Who</div>
                <select className={`filter-mobile-select ${filterWho!=='all'?'active':''}`} value={filterWho}
                  onChange={e => { setFilterWho(e.target.value); setDisplayCount(60); }}>
                  <option value="all">Everyone</option>
                  {WHO_OPTIONS.map(w => <option key={w.value} value={w.value}>{w.label}</option>)}
                </select>
              </div>
              <div>
                <div className="filter-mobile-label">Rating</div>
                <select className={`filter-mobile-select ${filterRating!=='all'?'active':''}`} value={filterRating}
                  onChange={e => { setFilterRating(e.target.value); setDisplayCount(60); if (e.target.value !== 'all') setFilterStatus('watched'); }}>
                  <option value="all">All ratings</option>
                  {[5,4.5,4,3.5,3,2.5,2,1.5,1,0.5].map(r => <option key={r} value={String(r)}>{r%1===0?'★'.repeat(r):'★'.repeat(Math.floor(r))+'½'} ({r})</option>)}
                </select>
              </div>
              <div>
                <div className="filter-mobile-label">Sort by</div>
                <select className="filter-mobile-select active" value={sortBy}
                  onChange={e => { setSortBy(e.target.value); setDisplayCount(60); }}>
                  {[{v:'status',l:'Status'},{v:'title',l:'A–Z'},{v:'priority',l:'Priority'},{v:'rating',l:'Rating'},{v:'ratedDate',l:'Recently rated'}].map(s => (
                    <option key={s.v} value={s.v}>{s.l}</option>
                  ))}
                </select>
              </div>
              <div style={{display:'flex',alignItems:'flex-end'}}>
                {(filterStatus !== 'unwatched' || filterType !== 'all' || filterWho !== 'all' || filterNetworks.length > 0 || filterRating !== 'all' || search || sortBy !== 'status') && (
                  <button className="filter-mobile-select" style={{background:'rgba(239,83,80,0.1)',color:'#ef5350',border:'1px solid #ef5350',fontWeight:600,cursor:'pointer'}}
                    onClick={() => { setFilterStatus('unwatched'); setFilterType('all'); setFilterWho('all'); setFilterNetworks([]); setFilterRating('all'); setSortBy('status'); setSortDir('asc'); setSearch(''); setDisplayCount(60); }}>
                    ✕ Clear filters
                  </button>
                )}
              </div>
            </div>
            {/* Platform — always chips in a scrolling row */}
            <div>
              <div className="filter-mobile-label">Platform {filterNetworks.length > 0 && <span style={{color:'var(--accent-gold)'}}>({filterNetworks.length} selected)</span>}</div>
              <div className="filter-platform-scroll">
                {[...MY_SUBS, ...NETWORK_OPTIONS.filter(n => !MY_SUBS.includes(n)).sort()].map(n => (
                  <span key={n} className={`filter-chip ${filterNetworks.includes(n)?'active':''}`}
                    style={{flexShrink:0, fontSize:12, padding:'4px 10px'}}
                    onClick={() => { setFilterNetworks(prev => prev.includes(n) ? prev.filter(x => x !== n) : [...prev, n]); setDisplayCount(60); }}>
                    {n}
                  </span>
                ))}
              </div>
            </div>
          </div>
        </div>
      </div>{/* filter-bar */}

      {/* Content */}
      <div className="content-area">
        {filtered.length === 0 ? (
          <div className="empty-state">
            <div className="empty-state-icon">🎬</div>
            <div className="empty-state-text">No content found</div>
            <div className="empty-state-sub">Try adjusting your filters or search</div>
          </div>
        ) : view === 'grid' ? (
          <>
            <div className="grid-view">
              {displayed.map(item => (
                <ContentCard key={`${item.id}-${item.season}`} item={item} onClick={handleCardClick} />
              ))}
            </div>
            {displayCount < filtered.length && (
              <div className="load-more">
                <button className="btn btn-secondary"
                  onClick={() => setDisplayCount(c => c + 60)}>
                  Load more ({filtered.length - displayCount} remaining)
                </button>
              </div>
            )}
          </>
        ) : (
          <div className="table-view">
            <table>
              <thead>
                <tr>
                  <th onClick={() => handleSort('title')}>Title <SortArrow field="title" /></th>
                  <th>Status</th>
                  <th onClick={() => handleSort('priority')}>Priority <SortArrow field="priority" /></th>
                  <th>Type</th>
                  <th>Season</th>
                  <th>Who</th>
                  <th onClick={() => handleSort('network')}>Network <SortArrow field="network" /></th>
                  <th onClick={() => handleSort('rating')}>Rating <SortArrow field="rating" /></th>
                  <th onClick={() => handleSort('releaseDate')}>Release <SortArrow field="releaseDate" /></th>
                  <th onClick={() => handleSort('ratedDate')}>Rated <SortArrow field="ratedDate" /></th>
                  <th>Non-Free</th>
                </tr>
              </thead>
              <tbody>
                {tableRows.map((row, idx) => {
                  if (row._type === 'group') {
                    const isExpanded = expandedGroups.has(row._key);
                    const seasons = row._items.map(i => i.season).filter(Boolean);
                    return (
                      <tr key={row._key + '-group'} style={{background:'rgba(245,197,24,0.04)', cursor:'pointer'}}
                        onClick={() => setExpandedGroups(prev => {
                          const next = new Set(prev);
                          next.has(row._key) ? next.delete(row._key) : next.add(row._key);
                          return next;
                        })}>
                        <td>
                          <div style={{display:'flex',alignItems:'center',gap:6}}>
                            {(() => { const p = row.posterUrl || (row._items.find(i=>i.posterUrl)||{}).posterUrl; return p ? <img src={p} className='table-poster-thumb' alt='' loading='lazy' /> : null; })()}
                            <span style={{fontSize:11,color:'var(--text-muted)',width:12,flexShrink:0}}>{isExpanded ? '▼' : '▶'}</span>
                            <span style={{fontWeight:600}}>{row.title}</span>
                            <span style={{fontSize:10,background:'rgba(245,197,24,0.15)',color:'var(--accent-gold)',padding:'1px 6px',borderRadius:4,fontWeight:700,flexShrink:0}}>
                              {row._items.length} seasons
                            </span>
                          </div>
                        </td>
                        <td><span className={`tag ${getStatusTagClass(row.status)}`}>{getStatusLabel(row.status)}</span></td>
                        <td style={{textAlign:'center'}}>{row.priority || '—'}</td>
                        <td>{getTypeEmoji(row.type)}</td>
                        <td style={{fontSize:11,color:'var(--text-muted)'}}>{seasons.join(', ')}</td>
                        <td>{getWhoEmoji(row.who)}</td>
                        <td><span className="card-network">{row.network || '—'}</span></td>
                        <td>{row._avgRating > 0 ? <StarRating rating={row._avgRating} size={12}/> : <span style={{color:'var(--text-muted)'}}>—</span>}</td>
                        <td></td>
                        <td>{row.nonFree ? <span className="tag tag-nonfree">$</span> : ''}</td>
                      </tr>
                    );
                  }
                  if (row._type === 'child') {
                    return <ContentTableRow key={`${row.id}-${row.season}-child`} item={row} onClick={handleCardClick} inlineEdit={inlineEdit} setInlineEdit={setInlineEdit} onUpdate={updateItem} isReadOnly={isReadOnly} />;
                  }
                  return <ContentTableRow key={`${row.id}-${row.season}`} item={row} onClick={handleCardClick} inlineEdit={inlineEdit} setInlineEdit={setInlineEdit} onUpdate={updateItem} isReadOnly={isReadOnly} />;
                })}
              </tbody>
            </table>
            {displayCount < filtered.length && (
              <div className="load-more">
                <button className="btn btn-secondary"
                  onClick={() => setDisplayCount(c => c + 100)}>
                  Load more ({filtered.length - displayCount} remaining)
                </button>
              </div>
            )}
          </div>
        )}
      </div>

      {/* Modals */}
      {showForm && !isReadOnly && (
        <FormModal item={showForm !== true ? showForm : null} onSave={handleAdd} onClose={() => { setShowForm(false); pendingRecDismiss.current = null; }} />
      )}

      {editItem && !isReadOnly && (
        <FormModal item={editItem} isEdit onSave={handleEdit}
          onClose={() => setEditItem(null)} />
      )}

      {detailItem && (
        <DetailModal item={detailItem} onClose={() => setDetailItem(null)}
          onEdit={(item) => { setDetailItem(null); setEditItem(item); }}
          onDelete={handleDelete}
          onAddNextSeason={handleAddNextSeason}
          isReadOnly={isReadOnly} />
      )}

      {/* Dupes modal */}
      {showDupesModal && (() => {
        const groups = {};
        items.forEach(item => {
          const key = (item.title || '').toLowerCase().trim();
          if (!groups[key]) groups[key] = [];
          groups[key].push(item);
        });
        const dupeGroups = Object.values(groups).filter(g => g.length > 1).sort((a,b) => a[0].title.localeCompare(b[0].title));
        return (
          <div className="modal-overlay" onClick={e => e.target===e.currentTarget && setShowDupesModal(false)}>
            <div className="modal" style={{maxWidth:700}}>
              <div className="modal-header">
                <h2>🔍 Find Duplicates</h2>
                <button className="modal-close" onClick={() => setShowDupesModal(false)}>&times;</button>
              </div>
              <div className="modal-body" style={{maxHeight:'65vh',overflowY:'auto'}}>
                {dupeGroups.length === 0 ? (
                  <div style={{textAlign:'center',padding:40,color:'var(--text-muted)'}}>
                    🎉 No duplicate titles found!
                  </div>
                ) : (
                  <>
                  <div style={{marginBottom:12,fontSize:12,color:'var(--text-muted)'}}>
                    Found {dupeGroups.length} title{dupeGroups.length>1?'s':''} with multiple entries. Click 🗑 to delete a specific entry.
                  </div>
                  {dupeGroups.map(group => (
                    <div key={group[0].title} style={{
                      marginBottom:16,background:'var(--bg-secondary)',borderRadius:10,
                      border:'1px solid var(--border)',overflow:'hidden'
                    }}>
                      <div style={{padding:'8px 14px',background:'rgba(245,197,24,0.08)',
                        borderBottom:'1px solid var(--border)',fontWeight:600,fontSize:13}}>
                        {group[0].title} <span style={{color:'var(--text-muted)',fontWeight:400,fontSize:11}}>({group.length} entries)</span>
                      </div>
                      {group.map(item => (
                        <div key={item.id} style={{
                          display:'flex',alignItems:'center',gap:10,padding:'8px 14px',
                          borderBottom:'1px solid rgba(255,255,255,0.04)'
                        }}>
                          {item.posterUrl && <img src={item.posterUrl} style={{width:28,height:40,objectFit:'cover',borderRadius:3,flexShrink:0}} alt="" />}
                          <div style={{flex:1,fontSize:12}}>
                            <span style={{color:'var(--text-muted)'}}>S{item.season || '—'}</span>
                            {' · '}
                            <span className={`tag ${getStatusTagClass(item.status)}`} style={{fontSize:10}}>{getStatusLabel(item.status)}</span>
                            {item.rating > 0 && <> · <span>★{item.rating}</span></>}
                            {' · '}<span style={{color:'var(--text-muted)'}}>{item.network || 'no network'}</span>
                            {item.ratedDate && <span style={{color:'var(--text-muted)',marginLeft:8}}>{item.ratedDate.slice(0,10)}</span>}
                          </div>
                          <button
                            style={{background:'rgba(239,83,80,0.15)',border:'1px solid rgba(239,83,80,0.3)',
                              color:'#ef5350',borderRadius:6,padding:'3px 10px',cursor:'pointer',fontSize:12,flexShrink:0}}
                            onClick={() => { if(window.confirm('Delete this entry?')) handleDelete(item); }}>
                            🗑 Delete
                          </button>
                        </div>
                      ))}
                    </div>
                  ))}
                  </>
                )}
              </div>
            </div>
          </div>
        );
      })()}

      {/* Toast */}
      {toast && (
        <div className="toast">
          <span className="toast-msg">{toast.msg}</span>
          {toast.onUndo && (
            <button className="toast-undo" onClick={async () => { await toast.onUndo(); dismissToast(); }}>
              Undo
            </button>
          )}
        </div>
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><AuthWrapper><App /></AuthWrapper></ErrorBoundary>);
</script>



</body>
</html>
