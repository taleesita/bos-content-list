<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-primary: #0a0a0f;
    --bg-secondary: #12121a;
    --bg-card: #1a1a2e;
    --bg-card-hover: #222240;
    --accent-gold: #f5c518;
    --accent-red: #e50914;
    --accent-blue: #4fc3f7;
    --accent-green: #66bb6a;
    --accent-purple: #ab47bc;
    --text-primary: #e8e8f0;
    --text-secondary: #9999aa;
    --text-muted: #666677;
    --border: #2a2a3e;
    --star-filled: #f5c518;
    --star-empty: #333355;
    --star-half: #f5c518;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: var(--bg-primary); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #444466; }

  /* Film grain overlay */
  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 9999;
    opacity: 0.4;
  }

  /* Animations */
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes slideIn { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }
  @keyframes glow { 0%, 100% { box-shadow: 0 0 5px rgba(245,197,24,0.2); } 50% { box-shadow: 0 0 20px rgba(245,197,24,0.4); } }
  @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  .fade-in { animation: fadeIn 0.3s ease-out; }

  /* Header */
  .header {
    background: linear-gradient(180deg, #0f0f1a 0%, var(--bg-primary) 100%);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
    padding-top: calc(16px + env(safe-area-inset-top, 0px));
    position: sticky;
    top: 0;
    z-index: 200;
  }

  .header-inner {
    max-width: 1400px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .logo-icon {
    width: 44px;
    height: 44px;
    background: transparent;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    box-shadow: 0 0 20px rgba(245,197,24,0.3);
  }

  .logo-text {
    font-family: 'Bebas Neue', cursive;
    font-size: 28px;
    letter-spacing: 2px;
    color: var(--text-primary);
  }

  .logo-sub {
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  /* Search bar */
  .search-bar {
    display: flex;
    align-items: center;
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 8px 16px;
    flex: 1;
    max-width: 400px;
    transition: border-color 0.2s;
  }

  .search-bar:focus-within { border-color: var(--accent-gold); }

  .search-bar input {
    background: transparent;
    border: none;
    color: var(--text-primary);
    font-size: 14px;
    outline: none;
    width: 100%;
    margin-left: 8px;
  }

  .search-bar input::placeholder { color: var(--text-muted); }

  /* Action buttons */
  .btn {
    padding: 8px 20px;
    border-radius: 8px;
    border: none;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .btn-primary {
    background: var(--accent-gold);
    color: #000;
  }

  .btn-primary:hover { background: #ffd633; transform: translateY(-1px); }

  .btn-secondary {
    background: var(--bg-card);
    color: var(--text-primary);
    border: 1px solid var(--border);
  }

  .btn-secondary:hover { background: var(--bg-card-hover); }

  .btn-danger {
    background: #331111;
    color: #ff6666;
    border: 1px solid #441111;
  }

  .btn-danger:hover { background: #441111; }

  .btn-sm { padding: 5px 12px; font-size: 12px; }

  /* Stats bar */
  .stats-bar {
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border);
    padding: 10px 24px;
    position: sticky;
    top: calc(var(--header-h, 80px));
    z-index: 150;
  }

  .stats-inner {
    max-width: 1400px;
    margin: 0 auto;
    display: flex;
    gap: 24px;
    overflow-x: auto;
    align-items: center;
  }

  .stat {
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
    font-size: 13px;
    color: var(--text-secondary);
  }

  .stat-num {
    font-weight: 700;
    color: var(--accent-gold);
    font-size: 16px;
  }

  .clickable-stat {
    cursor: pointer;
    border-radius: 6px;
    padding: 2px 6px;
    transition: background 0.15s;
  }
  .clickable-stat:hover { background: rgba(245,197,24,0.08); }

  /* Recs panel */
  .recs-bar {
    background: linear-gradient(180deg, rgba(245,197,24,0.1) 0%, rgba(245,197,24,0.03) 100%);
    border-top: 2px solid rgba(245,197,24,0.4);
    border-bottom: 1px solid rgba(245,197,24,0.15);
    padding: 0 24px;
  }
  .recs-toggle {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 0; cursor: pointer; user-select: none;
  }
  .recs-toggle-label {
    display: flex; align-items: center; gap: 10px;
    font-size: 17px; font-weight: 700; color: var(--accent-gold);
    font-family: 'Bebas Neue', cursive; letter-spacing: 1.5px;
    text-shadow: 0 0 20px rgba(245,197,24,0.3);
  }
  .recs-badge {
    background: var(--accent-gold); color: #000;
    font-size: 11px; font-weight: 700; padding: 2px 8px;
    border-radius: 10px; min-width: 22px; text-align: center;
    font-family: 'Inter', sans-serif;
  }
  .recs-scroll {
    display: flex; gap: 14px; overflow-x: auto; padding-bottom: 16px;
    scrollbar-width: none;
  }
  .recs-scroll::-webkit-scrollbar { display: none; }
  .rec-card {
    flex-shrink: 0; width: 136px; background: var(--bg-card);
    border-radius: 12px; border: 1px solid rgba(255,255,255,0.1);
    overflow: hidden; position: relative;
    transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
    box-shadow: 0 4px 16px rgba(0,0,0,0.4);
  }
  .rec-card:hover {
    border-color: var(--accent-gold);
    transform: translateY(-2px);

}

// Fetch streaming providers for a TMDB id+type, returns our network label or null
async function fetchProviders(tmdbId, type) {
  if (!TMDB_API_KEY || !tmdbId) return null;
  try {
    const mediaType = type === 'movie' ? 'movie' : 'tv';
    const res = await fetch(
      `https://api.themoviedb.org/3/${mediaType}/${tmdbId}/watch/providers?api_key=${TMDB_API_KEY}`
    );
    const data = await res.json();
    const us = data.results?.US;
    const flatrate = us?.flatrate || [];
    // Find first provider we recognise, prefer MY_SUBS
    const all = flatrate.map(p => PROVIDER_MAP[p.provider_name]).filter(Boolean);
    const subMatch = all.find(n => MY_SUBS.includes(n));
    return subMatch || all[0] || null;
  } catch(e) { return null; }
}

const TITLE_LOWER_WORDS = new Set(['a','an','the','and','but','or','for','nor','on','at','to','by','in','of','up','as','is','it','vs','via']);
function toTitleCase(str) {
  if (!str) return str;
  return str.split(' ').map((word, i) => {
    if (!word) return word;
    if (word === word.toUpperCase() && word.length > 1 && /[A-Z]/.test(word)) return word; // preserve acronyms
    if (i > 0 && TITLE_LOWER_WORDS.has(word.toLowerCase())) return word.toLowerCase();
    return word.charAt(0).toUpperCase() + word.slice(1).toLowerCase();
  }).join(' ');
}

// ============ STAR RATING COMPONENT ============
function StarIcon({ fill = 'empty', size = 14 }) {
  const color = fill === 'empty' ? 'var(--star-empty)' : 'var(--star-filled)';
  if (fill === 'half') {
    return (
      <svg width={size} height={size} viewBox="0 0 24 24">
        <defs>
          <linearGradient id="halfGrad">
            <stop offset="50%" stopColor="var(--star-filled)" />
            <stop offset="50%" stopColor="var(--star-empty)" />
          </linearGradient>
        </defs>
        <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"
          fill="url(#halfGrad)" />
      </svg>
    );
  }
  return (
    <svg width={size} height={size} viewBox="0 0 24 24">
      <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"
        fill={color} />
    </svg>
  );
}

function StarRating({ rating, size = 14 }) {
  if (!rating) return <span style={{color:'var(--text-muted)', fontSize: 11}}>—</span>;
  const stars = [];
  for (let i = 1; i <= 5; i++) {
    if (rating >= i) stars.push(<StarIcon key={i} fill="full" size={size} />);
    else if (rating >= i - 0.5) stars.push(<StarIcon key={i} fill="half" size={size} />);
    else stars.push(<StarIcon key={i} fill="empty" size={size} />);
  }
  return <span className="stars">{stars}</span>;
}

function StarRatingInput({ value, onChange }) {
  const [hover, setHover] = useState(0);

  const handleClick = (starIndex, isHalf) => {
    const newVal = isHalf ? starIndex - 0.5 : starIndex;
    onChange(newVal === value ? 0 : newVal);
  };

  return (
    <div className="rating-input">
      {[1,2,3,4,5].map(i => {
        const displayVal = hover || value;
        let fill = 'empty';
        if (displayVal >= i) fill = 'full';
        else if (displayVal >= i - 0.5) fill = 'half';

        return (
          <div key={i} style={{position:'relative', cursor:'pointer', width: 28, height: 28}}
            onMouseLeave={() => setHover(0)}>
            <div style={{position:'absolute', left:0, top:0, width:'50%', height:'100%', zIndex:2}}
              onMouseEnter={() => setHover(i - 0.5)}
              onClick={() => handleClick(i, true)} />
            <div style={{position:'absolute', right:0, top:0, width:'50%', height:'100%', zIndex:2}}
              onMouseEnter={() => setHover(i)}
              onClick={() => handleClick(i, false)} />
            <StarIcon fill={fill} size={24} />
          </div>
        );
      })}
      {value > 0 && (
        <span style={{marginLeft: 8, fontSize: 13, color: 'var(--text-secondary)'}}>
          {value}/5
        </span>
      )}
    </div>
  );
}

// ============ TMDB SEARCH ============
function useTMDBSearch() {
  const [results, setResults] = useState([]);
  const [loading, setLoading] = useState(false);
  const timeoutRef = useRef(null);

  const search = useCallback((query) => {
    if (!TMDB_API_KEY || !query || query.length < 2) {
      setResults([]);
      return;
    }
    clearTimeout(timeoutRef.current);
    timeoutRef.current = setTimeout(async () => {
      setLoading(true);
      try {
        // multi search returns both movies and TV shows
        const res = await fetch(
          `https://api.themoviedb.org/3/search/multi?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(query)}`
        );
        const data = await res.json();
        // Filter to only movies and TV, drop people/other
        const filtered = (data.results || [])
          .filter(r => r.media_type === 'movie' || r.media_type === 'tv')
          .slice(0, 8);
        setResults(filtered);
      } catch(e) {
        setResults([]);
      }
      setLoading(false);
    }, 400);
  }, []);

  return { results, loading, search, clear: () => setResults([]) };
}

// ============ DATA STORAGE (localStorage) ============
// Note: In the final version this will be Firebase. For now, in-memory + we'll embed the CSV data.
// ── Date formatter helper ──
const formatDate = (date) => {
  return `${date.getMonth()+1}/${date.getDate()}/${date.getFullYear()} ${date.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',hour12:true}).toLowerCase()}`;
};

// ── Background poster + provider fetcher (fire-and-forget after save) ────────
async function autoFetchPoster(firestoreId, title, type) {
  if (!TMDB_API_KEY || !title || !firestoreId) return;
  try {
    const mediaType = type === 'movie' ? 'movie' : 'tv';
    const res = await fetch(
      `https://api.themoviedb.org/3/search/${mediaType}?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(title)}`
    );
    const data = await res.json();
    const result = data.results?.[0];
    if (!result) return;
    const updates = { tmdbId: result.id };
    if (result.overview) updates.overview = result.overview;
    if (result.poster_path) updates.posterUrl = TMDB_IMG_BASE + result.poster_path;
    const provider = await fetchProviders(result.id, type);
    if (provider) updates.network = provider;
    await db.collection('content').doc(firestoreId).update(updates);
  } catch(e) {}
}

function useDataStore() {
  const [items, setItems] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [importing, setImporting] = useState(false);

  useEffect(() => {
    const unsubscribe = db.collection('content')
      .orderBy('title')
      .onSnapshot(snapshot => {
        const data = snapshot.docs.map(doc => ({ ...doc.data(), firestoreId: doc.id }));
        setItems(data);
        setLoaded(true);
      }, err => {
        console.error('Firestore error:', err);
        setLoaded(true);
      });
    return unsubscribe;
  }, []);


  const addItem = useCallback(async (item) => {
    const now = new Date();
    const newItem = {
      ...item,
      id: Date.now(),
      ratedDate: item.rating > 0 ? formatDate(now) : '',
      posterUrl: item.posterUrl || '',
      noPoster: item.noPoster || false,
    };
    const docRef = await db.collection('content').add(newItem);
    // Auto-fetch poster in background if none set and not flagged to skip
    if (!newItem.posterUrl && !newItem.noPoster) {
      autoFetchPoster(docRef.id, item.title, item.type);
    }
    return { id: newItem.id, firestoreId: docRef.id };
  }, []);

  const updateItem = useCallback(async (id, updates) => {
    const item = items.find(i => i.id === id);
    if (!item?.firestoreId) return;
    const updated = { ...updates };
    if (updates.rating !== undefined && updates.rating !== item.rating && updates.rating > 0) {
      updated.ratedDate = formatDate(new Date());
    }
    await db.collection('content').doc(item.firestoreId).update(updated);
  }, [items]);

  const deleteItem = useCallback(async (id) => {
    const item = items.find(i => i.id === id);
    if (!item?.firestoreId) return;
    await db.collection('content').doc(item.firestoreId).delete();
  }, [items]);

  const importInitialData = useCallback(async () => {
    setImporting(true);
    try {
      const batchSize = 400;
      for (let i = 0; i < INITIAL_DATA.length; i += batchSize) {
        const batch = db.batch();
        INITIAL_DATA.slice(i, i + batchSize).forEach(item => {
          batch.set(db.collection('content').doc(), item);
        });
        await batch.commit();
      }
    } catch(e) {
      console.error('Import error:', e);
    }
    setImporting(false);
  }, []);

  return { items, loaded, importing, addItem, updateItem, deleteItem, importInitialData };
}

// ============ FORM MODAL ============
function FormModal({ item, onSave, onClose, isEdit }) {
  const defaults = {
    title: '', status: 'want_to_watch', priority: '1', type: 'tv',
    season: '1', who: 'together', network: '', rating: 0,
    releaseDate: '', nonFree: false, posterUrl: '', ratedDate: '', overview: '', tmdbId: null,
  };
  const [form, setForm] = useState(item ? { ...defaults, ...item } : defaults);
  const tmdb = useTMDBSearch();
  const [showTMDB, setShowTMDB] = useState(false);
  const [tmdbSeasons, setTmdbSeasons] = useState([]);
  const [loadingSeasons, setLoadingSeasons] = useState(false);
  const titleRef = useRef(null);

  const set = (field, value) => setForm(prev => ({ ...prev, [field]: value }));

  // On open, if TV show with a tmdbId (edit OR add-with-prefill), pre-load seasons
  useEffect(() => {
    if (item?.tmdbId && item?.type !== 'movie') {
      setLoadingSeasons(true);
      fetch(`https://api.themoviedb.org/3/tv/${item.tmdbId}?api_key=${TMDB_API_KEY}`)
        .then(r => r.json())
        .then(d => {
          const seasons = (d.seasons || []).filter(s => s.season_number > 0);
          setTmdbSeasons(seasons);
        })
        .catch(() => {})
        .finally(() => setLoadingSeasons(false));
    }
  }, []);

  const handleTitleChange = (e) => {
    const val = e.target.value;
    set('title', val);
    if (val.length >= 2) {
      tmdb.search(val);
      setShowTMDB(true);
    } else {
      setShowTMDB(false);
    }
  };

  const selectTMDB = async (result) => {
    const title = result.title || result.name || '';
    const posterPath = result.poster_path ? TMDB_IMG_BASE + result.poster_path : '';
    const releaseDate = result.release_date || result.first_air_date || '';
    // Auto-set type from TMDB media_type
    const mediaType = result.media_type === 'movie' ? 'movie' : 'tv';
    set('title', title);
    set('type', mediaType);
    set('posterUrl', posterPath);
    set('tmdbId', result.id);
    if (releaseDate) set('releaseDate', releaseDate);
    if (result.overview) set('overview', result.overview);
    setShowTMDB(false);
    tmdb.clear();
    // Auto-fill network from watch providers
    const provider = await fetchProviders(result.id, mediaType);
    if (provider) set('network', provider);
    // For TV shows, fetch seasons list + network fallback
    if (mediaType === 'tv') {
      setLoadingSeasons(true);
      try {
        const tvRes = await fetch(`https://api.themoviedb.org/3/tv/${result.id}?api_key=${TMDB_API_KEY}`);
        const tvData = await tvRes.json();
        const seasons = (tvData.seasons || []).filter(s => s.season_number > 0);
        setTmdbSeasons(seasons);
        // If watch providers didn't match, try mapping from the show's networks array
        if (!provider && tvData.networks?.length) {
          for (const net of tvData.networks) {
            const mapped = TMDB_NETWORK_NAME_MAP[net.name];
            if (mapped) { set('network', mapped); break; }
          }
        }
      } catch(e) { setTmdbSeasons([]); }
      setLoadingSeasons(false);
    } else {
      setTmdbSeasons([]);
    }
  };

  const handleSeasonSelect = async (seasonNum) => {
    set('season', String(seasonNum));
    if (!form.tmdbId || !seasonNum) return;
    try {
      const res = await fetch(`https://api.themoviedb.org/3/tv/${form.tmdbId}/season/${seasonNum}?api_key=${TMDB_API_KEY}`);
      const data = await res.json();
      if (data.air_date) set('releaseDate', data.air_date);
    } catch(e) {}
  };

  const handleSubmit = (e) => {
    e.preventDefault();
    if (!form.title.trim()) return;
    onSave(form);
    onClose();
  };

  return (
    <div className="modal-overlay" onClick={(e) => e.target === e.currentTarget && onClose()}>
      <div className="modal">
        <div className="modal-header">
          <h2>{isEdit ? '✏️ Edit Entry' : '🎬 Add New Content'}</h2>
          <button className="modal-close" onClick={onClose}>&times;</button>
        </div>
        <div className="modal-body">
          <form onSubmit={handleSubmit}>
            <div className="form-grid">
              {/* Title with TMDB */}
              <div className="form-group full-width" style={{position:'relative'}}>
                <label>Title <span className="required">*</span></label>
                <input className="form-input" ref={titleRef} value={form.title}
                  onChange={handleTitleChange} placeholder="Start typing to search..."
                  autoFocus />
                {showTMDB && tmdb.results.length > 0 && (
                  <div className="tmdb-dropdown">
                    {tmdb.results.map(r => (
                      <div key={r.id} className="tmdb-item" onClick={() => selectTMDB(r)}>
                        {r.poster_path && <img src={TMDB_IMG_BASE + r.poster_path} alt="" />}
                        <div className="tmdb-item-info">
                          <div className="tmdb-item-title">{r.title || r.name}</div>
                          <div className="tmdb-item-year">
                            {(r.release_date || r.first_air_date || '').slice(0,4)}
                            <span style={{marginLeft:6, fontSize:9, padding:'1px 5px', borderRadius:4,
                              background: r.media_type === 'movie' ? 'rgba(79,195,247,0.15)' : 'rgba(171,71,188,0.15)',
                              color: r.media_type === 'movie' ? 'var(--accent-blue)' : 'var(--accent-purple)',
                              fontWeight:700, textTransform:'uppercase', letterSpacing:0.5}}>
                              {r.media_type === 'movie' ? '🎬 Movie' : '📺 TV'}
                            </span>
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
                {TMDB_API_KEY === '' && (
                  <div style={{fontSize: 11, color: 'var(--text-muted)', marginTop: 4}}>
                    💡 Add a TMDB API key to enable auto-search for posters & metadata
                  </div>
                )}
              </div>

              {/* Status */}
              <div className="form-group">
                <label>Status <span className="required">*</span></label>
                <select className="form-select" value={form.status} onChange={e => set('status', e.target.value)}>
                  {STATUS_OPTIONS.map(o => <option key={o.value} value={o.value}>{o.label}</option>)}
                </select>
              </div>

              {/* Priority */}
              <div className="form-group">
                <label>Priority <span className="required">*</span></label>
                <select className="form-select" value={form.priority} onChange={e => set('priority', e.target.value)}>
                  {PRIORITY_OPTIONS.map(p => <option key={p} value={p}>{p}</option>)}
                </select>
              </div>

              {/* Type */}
              <div className="form-group">
                <label>Type <span className="required">*</span></label>
                <select className="form-select" value={form.type} onChange={e => {
                  const t = e.target.value;
                  set('type', t);
                  if (t === 'movie') set('season', '');
                  else if (!form.season) set('season', '1');
                }}>
                  {TYPE_OPTIONS.map(o => <option key={o.value} value={o.value}>{o.label}</option>)}
                </select>
              </div>

              {/* Season */}
              <div className="form-group">
                <label>Season{loadingSeasons && <span style={{fontSize:11,color:'var(--text-muted)',marginLeft:6}}>loading…</span>}</label>
                {tmdbSeasons.length > 0 ? (
                  <select className="form-select" value={form.season}
                    onChange={e => handleSeasonSelect(e.target.value)}>
                    <option value="">Select season…</option>
                    {tmdbSeasons.map(s => (
                      <option key={s.season_number} value={String(s.season_number)}>
                        Season {s.season_number}{s.air_date ? ` (${s.air_date.slice(0,4)})` : ''}{s.episode_count ? ` · ${s.episode_count} eps` : ''}
                      </option>
                    ))}
                  </select>
                ) : (
                  <input className="form-input" value={form.season}
                    onChange={e => set('season', e.target.value)}
                    placeholder="e.g. 1, 1-3, All" />
                )}
              </div>

              {/* Who */}
              <div className="form-group">
                <label>Who? <span className="required">*</span></label>
                <select className="form-select" value={form.who} onChange={e => set('who', e.target.value)}>
                  {WHO_OPTIONS.map(o => <option key={o.value} value={o.value}>{o.label}</option>)}
                </select>
              </div>

              {/* Network */}
              <div className="form-group">
                <label>Network <span className="required">*</span></label>
                <select className="form-select" value={form.network} onChange={e => set('network', e.target.value)}>
                  <option value="">Select...</option>
                  <optgroup label="Your subscriptions">
                    {MY_SUBS.map(n => <option key={n} value={n}>{n}</option>)}

                </select>
              </div>

              {/* Release Date */}

              <div className="form-group">

// Compact star rating for inline table editing
function InlineStarRating({ value, onChange }) {
  return (
    <div className="inline-star" onClick={e => e.stopPropagation()}>
      {[1,2,3,4,5].map(i => (
        <div key={i} style={{position:'relative',width:14,height:14}}>
          <div style={{position:'absolute',left:0,top:0,width:'50%',height:'100%',zIndex:2}}
            onClick={() => onChange(i-0.5 === value ? 0 : i-0.5)} />
          <div style={{position:'absolute',right:0,top:0,width:'50%',height:'100%',zIndex:2}}
            onClick={() => onChange(i === value ? 0 : i)} />

        </div>
      ))}

function ContentTableRow({ item, onClick, inlineEdit, setInlineEdit, onUpdate, isReadOnly = false }) {
  const editing = (field) => !isReadOnly && inlineEdit?.id === item.id && inlineEdit?.field === field;
  const startEdit = (e, field) => { if (isReadOnly) return; e.stopPropagation(); setInlineEdit({ id: item.id, field }); };
  const save = (field, value) => { onUpdate(item.id, { [field]: value }); setInlineEdit(null); };
  const cancel = () => setInlineEdit(null);
  return (
    <tr style={{cursor:'pointer'}} onClick={() => { if (!inlineEdit) onClick(item); }}>
      <td onClick={(e) => { e.stopPropagation(); onClick(item); }}>
        <div style={{display:'flex', alignItems:'center'}}>
          {item.posterUrl && <img src={item.posterUrl} className="table-poster-thumb" alt="" loading="lazy" />}
          <span className="table-row-title">{item.title}</span>
        </div>
      </td>
      {/* Status */}
      <td onClick={(e) => startEdit(e, 'status')}>
        {editing('status') ? (
          <select autoFocus className="inline-select" value={item.status}
            onChange={e => save('status', e.target.value)}
            onBlur={cancel} onClick={e => e.stopPropagation()}>
            {STATUS_OPTIONS.map(o => <option key={o.value} value={o.value}>{o.label}</option>)}
          </select>
        ) : <span className={`tag ${getStatusTagClass(item.status)} editable-cell`}>{getStatusLabel(item.status)}</span>}
      </td>
      {/* Priority */}
      <td style={{textAlign:'center'}} onClick={(e) => startEdit(e, 'priority')}>
        {editing('priority') ? (
          <select autoFocus className="inline-select" value={item.priority}
            onChange={e => save('priority', e.target.value)}
            onBlur={cancel} onClick={e => e.stopPropagation()}>
            {PRIORITY_OPTIONS.map(p => <option key={p} value={p}>{p}</option>)}
          </select>
        ) : <span className="editable-cell" style={{color: getPriorityColor(item.priority), fontWeight: item.priority && item.priority !== '-' && item.priority !== 'n/a' ? 700 : 'inherit'}}>{item.priority !== '' && item.priority !== 'n/a' ? item.priority : '—'}</span>}
      </td>
      <td>{getTypeEmoji(item.type)}</td>
      {/* Season */}
      <td onClick={(e) => startEdit(e, 'season')}>
        {editing('season') ? (
          <input autoFocus className="inline-input" defaultValue={item.season || ''}
            onBlur={e => save('season', e.target.value)}
            onKeyDown={e => { if (e.key==='Enter') save('season', e.target.value); if (e.key==='Escape') cancel(); }}
            onClick={e => e.stopPropagation()} />
        ) : <span className="editable-cell">{item.season ? formatSeason(item.season) : '—'}</span>}
      </td>
      {/* Who */}
      <td onClick={(e) => startEdit(e, 'who')}>
        {editing('who') ? (
          <select autoFocus className="inline-select" value={item.who}
            onChange={e => save('who', e.target.value)}
            onBlur={cancel} onClick={e => e.stopPropagation()}>
            {WHO_OPTIONS.map(o => <option key={o.value} value={o.value}>{o.label}</option>)}
          </select>
        ) : <span className="editable-cell">{getWhoEmoji(item.who)}</span>}
      </td>
      {/* Network */}
      <td onClick={(e) => startEdit(e, 'network')}>
        {editing('network') ? (
          <select autoFocus className="inline-select" value={item.network || ''}
            onChange={e => save('network', e.target.value)}
            onBlur={cancel} onClick={e => e.stopPropagation()}>
            <option value="">—</option>
            {NETWORK_OPTIONS.map(n => <option key={n} value={n}>{n}</option>)}
          </select>
        ) : <span className="editable-cell card-network">{item.network || '—'}</span>}
      </td>
      {/* Release Date */}
      <td onClick={(e) => startEdit(e, 'releaseDate')}>
        {editing('releaseDate') ? (
          <input autoFocus className="inline-input" type="date"
            defaultValue={item.releaseDate ? item.releaseDate.split('T')[0] : ''}
            onBlur={e => save('releaseDate', e.target.value)}
            onKeyDown={e => { if (e.key==='Enter') save('releaseDate', e.target.value); if (e.key==='Escape') cancel(); }}
            onClick={e => e.stopPropagation()} />
        ) : (
          <span className="editable-cell" style={{fontSize:11,color:'var(--text-muted)',whiteSpace:'nowrap'}}>
            {item.releaseDate ? (() => {
              const s = item.releaseDate;
              if (s.includes('-')) { const p = s.split('T')[0].split('-'); if (p.length >= 3) { const y = parseInt(p[0]), m = parseInt(p[1]), d = parseInt(p[2]); if (!isNaN(y) && !isNaN(m) && !isNaN(d)) return `${m}/${d}/${y}`; } }
              if (s.includes('/')) { const p = s.split('/'); const m = parseInt(p[0]), d = parseInt(p[1]), y = parseInt(p[2]); if (!isNaN(m) && !isNaN(d) && !isNaN(y)) return `${m}/${d}/${y}`; }
              return s;
            })() : ''}
          </span>
        )}
      </td>
      {/* Rating — always interactive */}
      <td><InlineStarRating value={item.rating} onChange={val => {
        const updates = { rating: val };
        if (val > 0 && item.status === 'want_to_watch') {
          updates.status = 'watched';
          updates.ratedDate = new Date().toLocaleDateString('en-US');
        }
        onUpdate(item.id, updates);
      }} /></td>
      {/* Rated Date */}
      <td onClick={(e) => startEdit(e, 'ratedDate')}>
        {editing('ratedDate') ? (
          <input autoFocus className="inline-input" type="date"
            defaultValue={item.ratedDate ? (() => {
              const s = item.ratedDate;
              if (s.includes('-')) return s.split('T')[0];
              if (s.includes('/')) { const p = s.split('/'); const m = String(parseInt(p[0])).padStart(2,'0'), d = String(parseInt(p[1])).padStart(2,'0'), y = parseInt(p[2]); if (!isNaN(y)) return `${y}-${m}-${d}`; }
              return '';
            })() : ''}
            onBlur={e => save('ratedDate', e.target.value)}
            onKeyDown={e => { if (e.key==='Enter') save('ratedDate', e.target.value); if (e.key==='Escape') cancel(); }}
            onClick={e => e.stopPropagation()} />
        ) : (
          <span className="editable-cell" style={{fontSize:11,color:'var(--text-muted)',whiteSpace:'nowrap'}}>
            {item.ratedDate ? (() => {
              const s = item.ratedDate;
              if (s.includes('/')) { const p = s.split('/'); const m = parseInt(p[0]), d = parseInt(p[1]), y = parseInt(p[2]); if (!isNaN(m) && !isNaN(d) && !isNaN(y)) return `${m}/${d}/${y}`; }
              if (s.includes('-')) { const p = s.split('T')[0].split('-'); if (p.length >= 3) { const y = parseInt(p[0]), m = parseInt(p[1]), d = parseInt(p[2]); if (!isNaN(y) && !isNaN(m) && !isNaN(d)) return `${m}/${d}/${y}`; } }
              return s;
            })() : ''}
          </span>
        )}
      </td>
      {/* Non-Free — click to toggle */}
      <td onClick={(e) => { e.stopPropagation(); onUpdate(item.id, {nonFree: !item.nonFree}); }}
        style={{cursor:'pointer', textAlign:'center'}}>
        {item.nonFree ? <span className="tag tag-nonfree">$</span> : <span style={{color:'var(--text-muted)'}}>—</span>}
      </td>
    </tr>
  );
}

// ── Auth Wrapper ──
function AuthWrapper({ children }) {
  const [user, setUser] = useState(null);
  const [authLoading, setAuthLoading] = useState(true);
  const [denied, setDenied] = useState(false);

  useEffect(() => {
    const unsubscribe = auth.onAuthStateChanged(u => {
      if (u) {
        if (ALLOWED_EMAILS.includes(u.email) || READ_ONLY_EMAILS.includes(u.email)) {
          setUser(u);
          setDenied(false);
        } else {
          auth.signOut();
          setDenied(true);
          setUser(null);
        }
      } else {
        setUser(null);
      }
      setAuthLoading(false);
    });
    return unsubscribe;
  }, []);

  const signIn = () => {
    const provider = new firebase.auth.GoogleAuthProvider();
    auth.signInWithPopup(provider);
  };

  const signOut = () => auth.signOut();

  if (authLoading) {
    return (
      <div style={{display:'flex',alignItems:'center',justifyContent:'center',
        height:'100vh',fontSize:24,color:'var(--text-primary)'}}>
        🎬 Loading...
      </div>
    );
  }

  if (!user) return <LoginScreen onSignIn={signIn} denied={denied} />;

  const isReadOnly = READ_ONLY_EMAILS.includes(user.email);
  return React.cloneElement(children, { user, onSignOut: signOut, isReadOnly });
}

  const [detailItem, setDetailItem] = useState(null);
  const [toast, setToast] = useState(null);

  const handleImport = async () => {

  };

  // Fetch tools
  const [posterProgress, setPosterProgress] = useState(null);
  const [platformProgress, setPlatformProgress] = useState(null);
  const [descProgress, setDescProgress] = useState(null);
  const [showToolsMenu, setShowToolsMenu] = useState(false);
  const [showUserMenu, setShowUserMenu] = useState(false);

  const [filtersOpen, setFiltersOpen] = useState(false);
  const [showRecs, setShowRecs] = useState(() => typeof window !== 'undefined' ? window.innerWidth > 768 : true);
  const [recs, setRecs] = useState(null); // null=not fetched, []|[...]=fetched
  const [recsLoading, setRecsLoading] = useState(false);
  const [recsVisible, setRecsVisible] = useState(10);
  const [expandedRec, setExpandedRec] = useState(null); // rec key showing description
  const [dismissedRecs, setDismissedRecs] = useState(() => {
    try { return new Set(JSON.parse(localStorage.getItem('dismissed_recs') || '[]')); } catch { return new Set(); }
  });
  const [showRestorePanel, setShowRestorePanel] = useState(false);
  const [snoozedRecs, setSnoozedRecs] = useState({}); // { key: expiryTimestamp }, synced to Firestore
  // Load snoozed recs from Firestore (syncs across devices)
  useEffect(() => {
    db.collection('settings').doc('rec_snooze').get().then(doc => {
      if (doc.exists) setSnoozedRecs(doc.data() || {});
    }).catch(() => {});
  }, []);
  const [expandedGroups, setExpandedGroups] = useState(new Set());
  const [inlineEdit, setInlineEdit] = useState(null); // {id, field}

  // Global search → TMDB suggestions when no local results
  useEffect(() => {
    if (search && search.length >= 2) {
      globalTMDB.search(search);
    } else {
      globalTMDB.clear();
    }
  }, [search]);

  const fixAllTitleCasing = useCallback(async () => {
    const toFix = items.filter(i => i.firestoreId && i.title && toTitleCase(i.title) !== i.title);
    if (!toFix.length) { showToast('✅ All titles already have consistent casing!'); return; }
    showToast(`🔤 Fixing casing on ${toFix.length} titles…`);
    let done = 0;
    for (const item of toFix) {
      await db.collection('content').doc(item.firestoreId).update({ title: toTitleCase(item.title) });
      done++;
    }
    showToast(`✅ Fixed casing on ${done} titles!`);
  }, [items]);

  const fetchAllPosters = useCallback(async () => {
    const missing = items.filter(i => !i.posterUrl && i.title && i.firestoreId);
    if (!missing.length) { showToast('✅ All items already have posters!'); return; }
    setPosterProgress({ done: 0, total: missing.length });
    let done = 0;
    const batchSize = 5;
    for (let i = 0; i < missing.length; i += batchSize) {
      const batch = missing.slice(i, i + batchSize);
      await Promise.all(batch.map(async (item) => {
        try {
          const mediaType = item.type === 'movie' ? 'movie' : 'tv';
          const res = await fetch(
            `https://api.themoviedb.org/3/search/${mediaType}?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(item.title)}`
          );
          const data = await res.json();
          const result = data.results?.[0];
          if (result?.poster_path) {
            await db.collection('content').doc(item.firestoreId).update({
              posterUrl: TMDB_IMG_BASE + result.poster_path
            });
          }
        } catch(e) {}
        done++;
        setPosterProgress({ done, total: missing.length });
      }));
      // Rate limit: pause between batches
      if (i + batchSize < missing.length) {
        await new Promise(r => setTimeout(r, 500));
      }
    }
    setPosterProgress(null);
    showToast('🎨 Poster fetch complete!');
  }, [items]);

  const fetchAllPlatforms = useCallback(async () => {
    const toFetch = items.filter(i => i.firestoreId && i.title);
    if (!toFetch.length) { showToast('Nothing to fetch.'); return; }
    setPlatformProgress({ done: 0, total: toFetch.length });
    let done = 0;
    const batchSize = 5;
    for (let i = 0; i < toFetch.length; i += batchSize) {
      const batch = toFetch.slice(i, i + batchSize);
      await Promise.all(batch.map(async (item) => {
        try {
          // Search TMDB to get the ID if we don't have it
          let tmdbId = item.tmdbId;
          if (!tmdbId) {
            const mediaType = item.type === 'movie' ? 'movie' : 'tv';
            const res = await fetch(
              `https://api.themoviedb.org/3/search/${mediaType}?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(item.title)}`
            );
            const data = await res.json();
            tmdbId = data.results?.[0]?.id;
          }
          if (tmdbId) {
            const provider = await fetchProviders(tmdbId, item.type);
            if (provider) {
              await db.collection('content').doc(item.firestoreId).update({ network: provider, tmdbId });
            }
          }
        } catch(e) {}
        done++;
        setPlatformProgress({ done, total: toFetch.length });
      }));
      if (i + batchSize < toFetch.length) await new Promise(r => setTimeout(r, 600));
    }
    setPlatformProgress(null);
    showToast('📡 Platform data updated!');
  }, [items]);

  const fetchAllDescriptions = useCallback(async () => {
    const toFetch = items.filter(i => i.firestoreId && i.title && !i.overview);
    if (!toFetch.length) { showToast('✅ All items already have descriptions!'); return; }
    setDescProgress({ done: 0, total: toFetch.length });
    let done = 0;
    const batchSize = 4;
    for (let i = 0; i < toFetch.length; i += batchSize) {
      const batch = toFetch.slice(i, i + batchSize);
      await Promise.all(batch.map(async (item) => {
        try {
          const mediaType = item.type === 'movie' ? 'movie' : 'tv';
          let tmdbId = item.tmdbId;
          // Search for tmdbId if we don't have it
          if (!tmdbId) {
            const res = await fetch(`https://api.themoviedb.org/3/search/${mediaType}?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(item.title)}`);
            const data = await res.json();
            tmdbId = data.results?.[0]?.id;
          }
          if (tmdbId) {
            let overview = '';
            if (item.type === 'tv' && item.season) {
              // Try season-specific overview first
              const sRes = await fetch(`https://api.themoviedb.org/3/tv/${tmdbId}/season/${item.season}?api_key=${TMDB_API_KEY}`);
              const sData = await sRes.json();
              overview = sData.overview || '';
            }
            if (!overview) {
              // Fall back to show/movie level overview
              const mRes = await fetch(`https://api.themoviedb.org/3/${mediaType}/${tmdbId}?api_key=${TMDB_API_KEY}`);
              const mData = await mRes.json();
              overview = mData.overview || '';
            }
            if (overview) {
              const updates = { overview };
              if (!item.tmdbId && tmdbId) updates.tmdbId = tmdbId;
              await db.collection('content').doc(item.firestoreId).update(updates);
            }
          }
        } catch(e) {}
        done++;
        setDescProgress({ done, total: toFetch.length });
      }));
      if (i + batchSize < toFetch.length) await new Promise(r => setTimeout(r, 600));
    }
    setDescProgress(null);
    showToast('📖 Descriptions fetched!');
  }, [items]);

  const dismissRec = (key) => {
    setDismissedRecs(prev => {
      const next = new Set(prev);
      next.add(key);
      try { localStorage.setItem('dismissed_recs', JSON.stringify([...next])); } catch {}
      return next;
    });
  };
  const snoozeRec = (key) => {
    setSnoozedRecs(prev => {
      const next = { ...prev, [key]: Date.now() + 30 * 24 * 60 * 60 * 1000 };
      db.collection('settings').doc('rec_snooze').set(next).catch(() => {});
      return next;
    });
  };

  const fetchRecs = useCallback(async () => {
    if (!TMDB_API_KEY) return;
    setRecsLoading(true);
    const results = [];
    const now = new Date();

    // Build lookup maps
    const existingTmdbIds = new Set(items.map(i => i.tmdbId).filter(Boolean).map(String));
    const existingTitles = new Set(items.map(i => i.title.toLowerCase().trim()));

    // ── 1. UPCOMING SEASONS ──────────────────────────────────────────────
    // Group ALL tv shows by title (not just tmdbId — many items may lack it)
    const tvByTitle = {};
    items.filter(i => i.type === 'tv').forEach(i => {
      const key = i.title.toLowerCase().trim();
      if (!tvByTitle[key]) tvByTitle[key] = {
        title: i.title, tmdbId: i.tmdbId || null,
        posterUrl: i.posterUrl || '', seasons: new Set(), maxRating: 0, network: '',
        isWatched: false, isWatching: false,
      };
      if (i.tmdbId && !tvByTitle[key].tmdbId) tvByTitle[key].tmdbId = i.tmdbId;
      if (i.posterUrl && !tvByTitle[key].posterUrl) tvByTitle[key].posterUrl = i.posterUrl;
      if (i.network && !tvByTitle[key].network) tvByTitle[key].network = i.network;
      tvByTitle[key].seasons.add(parseInt(i.season) || 0);
      if (i.rating > tvByTitle[key].maxRating) tvByTitle[key].maxRating = i.rating;
      if ((i.ratedDate || '') > (tvByTitle[key].lastRatedDate || '')) tvByTitle[key].lastRatedDate = i.ratedDate || '';
      if (i.status === 'watched') tvByTitle[key].isWatched = true;
      if (i.status === 'watching') tvByTitle[key].isWatching = true;
    });

    // Only check shows with at least 1 real season tracked (season > 0)
    // Sort: watching first > watched > other; then by rating; then recency
    const tvShows = Object.values(tvByTitle)
      .filter(s => [...s.seasons].some(n => n > 0))
      .sort((a, b) => {
        const aStatus = a.isWatching ? 2 : a.isWatched ? 1 : 0;
        const bStatus = b.isWatching ? 2 : b.isWatched ? 1 : 0;
        if (bStatus !== aStatus) return bStatus - aStatus;
        if ((b.maxRating || 0) !== (a.maxRating || 0)) return (b.maxRating || 0) - (a.maxRating || 0);
        return (b.lastRatedDate || '').localeCompare(a.lastRatedDate || '');
      })
      .slice(0, 300); // check up to 300 shows

    // Fetch in small parallel batches
    const upcomingBatch = 8;
    for (let i = 0; i < tvShows.length; i += upcomingBatch) {
      await Promise.all(tvShows.slice(i, i + upcomingBatch).map(async (show) => {
        try {
          let tmdbId = show.tmdbId;
          if (!tmdbId) {
            const sr = await fetch(`https://api.themoviedb.org/3/search/tv?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(show.title)}`);
            const sd = await sr.json();
            tmdbId = sd.results?.[0]?.id;
          }
          if (!tmdbId) return;

          const res = await fetch(`https://api.themoviedb.org/3/tv/${tmdbId}?api_key=${TMDB_API_KEY}`);
          const data = await res.json();

          const trackedSeasons = [...show.seasons].filter(n => n > 0);
          const maxTracked = Math.max(...trackedSeasons);

          // Check if TMDB has an announced next season
          const nextNum = maxTracked + 1;
          const allSeasons = (data.seasons || []).filter(s => s.season_number > 0);
          const nextSeason = allSeasons.find(s => s.season_number === nextNum);

          let airDateStr = nextSeason?.air_date || null;
          // Fall back to next_episode_to_air on the show
          if (!airDateStr && data.next_episode_to_air?.season_number === nextNum) {
            airDateStr = data.next_episode_to_air.air_date;
          }

          if (airDateStr) {
            const airDate = new Date(airDateStr);
            const daysUntil = Math.round((airDate - now) / 86400000);
            // Surface: up to 6 months future OR up to 1 year past (haven't added it yet)
            if (daysUntil > -365 && daysUntil < 180) {
              const alreadyAdded = show.seasons.has(nextNum);
              if (!alreadyAdded) {
                const posterUrl = nextSeason?.poster_path
                  ? TMDB_IMG_BASE + nextSeason.poster_path
                  : (data.poster_path ? TMDB_IMG_BASE + data.poster_path : show.posterUrl);
                const dateLabel = daysUntil < 0
                  ? `S${nextNum} out since ${new Date(airDateStr).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}`
                  : daysUntil === 0 ? `S${nextNum} drops today! 🎉`
                  : daysUntil <= 7 ? `S${nextNum} in ${daysUntil} days`
                  : `S${nextNum} · ${new Date(airDateStr).toLocaleDateString('en-US',{month:'short',day:'numeric',year:daysUntil>300?'numeric':undefined})}`;
                const prevMax = Math.max(...[...show.seasons].filter(n => n > 0));
                // Network: use saved value, or fall back to TMDB's first listed network
                const tmdbNetwork = data.networks?.[0]?.name || null;
                const platform = show.network || tmdbNetwork;
                results.push({
                  key: `upcoming_${tmdbId}_s${nextNum}`,
                  type: 'upcoming', title: show.title, season: nextNum,
                  tmdbId, mediaType: 'tv', posterUrl, airDate: airDateStr,
                  daysUntil, reason: dateLabel, platform: platform || null,
                  overview: nextSeason?.overview || data.overview || '',
                  because: `Because you watched S${prevMax}`,
                });
              }
            }
          }
        } catch(e) {}
      }));
    }

    // ── 2. SIMILAR CONTENT ───────────────────────────────────────────────
    // Seed from 4★+ rated items the current user has watched
    const EMAIL_TO_WHO = {
      'taly.matiteyahu@gmail.com': 'taly',
      'doug.pickard@gmail.com': 'doug',
    };
    const myWho = EMAIL_TO_WHO[user?.email] || null;
    // Only include seeds the current user actually watched (their own or together)
    const seeds = [...items]
      .filter(i => i.rating >= 3.5 && i.tmdbId &&
        (!myWho || i.who === myWho || i.who === 'together' || i.who === 'separately'))
      .sort((a, b) => b.rating - a.rating || (b.ratedDate||'').localeCompare(a.ratedDate||''))
      .slice(0, 20);

    // Score map: tmdbId → { rec, score, reasons[] }
    const recMap = new Map();

    await Promise.all(seeds.map(async (seed) => {
      try {
        const mt = seed.type === 'movie' ? 'movie' : 'tv';
        const [recRes, simRes] = await Promise.all([
          fetch(`https://api.themoviedb.org/3/${mt}/${seed.tmdbId}/recommendations?api_key=${TMDB_API_KEY}`),
          fetch(`https://api.themoviedb.org/3/${mt}/${seed.tmdbId}/similar?api_key=${TMDB_API_KEY}`),
        ]);
        const [recData, simData] = await Promise.all([recRes.json(), simRes.json()]);
        const allResults = [...(recData.results||[]), ...(simData.results||[])];
        allResults.forEach(r => {
          const rTitle = (r.name || r.title || '').trim();
          const rId = String(r.id);
          if (existingTmdbIds.has(rId)) return;
          if (existingTitles.has(rTitle.toLowerCase())) return;
          if (!r.poster_path) return;
          // Filter non-English content not already in the user's list
          if (r.original_language && r.original_language !== 'en') {
            if (!existingTitles.has(rTitle.toLowerCase())) return;
          }
          // Filter out obscure/old content: require meaningful vote count & recency
          if ((r.vote_count || 0) < 30) return;
          const airYear = parseInt((r.first_air_date || r.release_date || '2000').slice(0, 4));
          if (airYear < 2005) return;
          if (!recMap.has(rId)) {
            recMap.set(rId, {
              key: `similar_${rId}`, type: 'similar',
              title: rTitle, tmdbId: r.id, mediaType: mt,
              posterUrl: TMDB_IMG_BASE + r.poster_path,
              overview: r.overview || '', platform: null,
              score: 0, topSeed: seed, topRating: seed.rating,
            });
          }
          const entry = recMap.get(rId);
          entry.score += seed.rating;
          if (seed.rating > entry.topRating) { entry.topSeed = seed; entry.topRating = seed.rating; }
        });
      } catch(e) {}
    }));

    // Top 20 by score, deduplicated
    const similar = [...recMap.values()]
      .sort((a, b) => b.score - a.score)
      .slice(0, 20)
      .map(e => ({ ...e, reason: `Because you liked ${e.topSeed.title}`, because: `Because you liked ${e.topSeed.title}` }));

    results.push(...similar);

    // Initial sort: upcoming soonest, then similar by score
    results.sort((a, b) => {
      if (a.type === 'upcoming' && b.type !== 'upcoming') return -1;
      if (b.type === 'upcoming' && a.type !== 'upcoming') return 1;
      if (a.type === 'upcoming') return (a.daysUntil ?? 999) - (b.daysUntil ?? 999);
      return (b.score || 0) - (a.score || 0);
    });

    // Publish what we have so far
    setRecs([...results]);

    // ── 3. NEW ON YOUR PLATFORMS (TMDB discover by network) ──────────────
    // Pull recent releases from each of your subscribed platforms
    const sixMonthsAgo = new Date(now); sixMonthsAgo.setMonth(sixMonthsAgo.getMonth() - 6);
    const airFrom = sixMonthsAgo.toISOString().slice(0,10);
    const airTo = new Date(now.getTime() + 90*86400000).toISOString().slice(0,10); // up to 3 months ahead

    const newOnPlatform = [];
    for (const sub of MY_SUBS) {
      const networkIds = MY_SUBS_TMDB_IDS[sub] || [];
      for (const netId of networkIds) {
        try {
          const res = await fetch(
            `https://api.themoviedb.org/3/discover/tv?api_key=${TMDB_API_KEY}` +
            `&with_networks=${netId}&first_air_date.gte=${airFrom}&first_air_date.lte=${airTo}` +
            `&sort_by=first_air_date.desc&vote_count.gte=5&page=1`
          );
          const data = await res.json();
          (data.results || []).forEach(r => {
            const rTitle = (r.name || '').trim();
            const rId = String(r.id);
            if (existingTmdbIds.has(rId)) return;
            if (existingTitles.has(rTitle.toLowerCase())) return;
            if (!r.poster_path) return;
            if (r.original_language && r.original_language !== 'en') return;
            if (results.some(x => String(x.tmdbId) === rId)) return; // already in similar list
            const airDate = new Date(r.first_air_date || airFrom);
            const daysAgo = Math.round((now - airDate) / 86400000);
            const daysUntil = -daysAgo;
            const simMatch = recMap.get(rId);
            newOnPlatform.push({
              key: `new_${rId}`,
              type: 'new',
              title: rTitle, tmdbId: r.id, mediaType: 'tv',
              posterUrl: TMDB_IMG_BASE + r.poster_path,
              overview: r.overview || '', platform: sub,
              airDate: r.first_air_date, daysUntil,
              score: r.vote_average || 0,
              reason: daysUntil >= 0
                ? `Out ${new Date(r.first_air_date).toLocaleDateString('en-US',{month:'short',day:'numeric'})}`
                : `Premiered ${Math.abs(daysUntil)}d ago`,
              because: simMatch ? `Because you liked ${simMatch.topSeed.title}` : null,
            });
          });
        } catch(e) {}
        await new Promise(r => setTimeout(r, 200)); // gentle rate limit
      }
    }

    // Dedupe new-on-platform by tmdbId, keep best (lowest daysUntil absolute)
    const newMap = new Map();
    newOnPlatform.forEach(r => {
      if (!newMap.has(r.tmdbId) || Math.abs(r.daysUntil) < Math.abs(newMap.get(r.tmdbId).daysUntil)) {
        newMap.set(r.tmdbId, r);
      }
    });
    results.push(...[...newMap.values()]);

    // ── 4. PLATFORM ENRICHMENT for similar recs ──────────────────────────
    const platformBatch = 6;
    const simResults = results.filter(r => r.type === 'similar');
    for (let i = 0; i < simResults.length; i += platformBatch) {
      await Promise.all(simResults.slice(i, i + platformBatch).map(async (rec) => {
        try {
          const p = await fetchProviders(rec.tmdbId, rec.mediaType === 'movie' ? 'movie' : 'tv');
          rec.platform = p || null;
        } catch(e) {}
      }));
    }

    // ── FINAL SORT ────────────────────────────────────────────────────────
    // 1. Upcoming seasons (soonest first)
    // 2. New on your platforms (soonest/most recent first)
    // 3. Similar on your subs (by score)
    // 4. Similar elsewhere (by score)
    const typeOrder = (r) => {
      if (r.type === 'upcoming') return 0;
      if (r.type === 'new') return 1;
      if (r.type === 'similar' && MY_SUBS.includes(r.platform)) return 2;
      return 3;
    };
    // Drop 'new' cards that have no genuine similarity connection — don't recommend just because it's on a platform
    const filtered = results.filter(r => r.type !== 'new' || r.because);

    filtered.sort((a, b) => {
      const ta = typeOrder(a), tb = typeOrder(b);
      if (ta !== tb) return ta - tb;
      if (a.type === 'upcoming') return (a.daysUntil ?? 999) - (b.daysUntil ?? 999);
      if (a.type === 'new') return Math.abs(a.daysUntil ?? 999) - Math.abs(b.daysUntil ?? 999);
      return (b.score || 0) - (a.score || 0);
    });

    setRecs([...filtered]);
    setRecsLoading(false);
  }, [items, user]);

  // Keep --table-header-top CSS var in sync so sticky thead lands below header+stats
  useEffect(() => {
    const update = () => {
      const h1 = document.querySelector('.header')?.offsetHeight || 0;
      const h2 = document.querySelector('.stats-bar')?.offsetHeight || 0;
      document.documentElement.style.setProperty('--table-header-top', (h1 + h2) + 'px');
    };
    update();
    window.addEventListener('resize', update);
    return () => window.removeEventListener('resize', update);
  }, []);

  // Auto-fetch recs on mount (banner defaults open)
  useEffect(() => {
    if (loaded && recs === null && !recsLoading) fetchRecs();
  }, [loaded]); // eslint-disable-line react-hooks/exhaustive-deps

  // Open recs and fetch if needed
  const toggleRecs = () => {
    setShowRecs(prev => {
      if (!prev && recs === null) fetchRecs();
      return !prev;
    });
  };

  // Toast helper — showToast(msg) or showToast(msg, { onUndo: fn, duration: ms })
  const showToast = (msg, options = {}) => {
    if (toastTimerRef.current) clearTimeout(toastTimerRef.current);
    setToast({ msg, onUndo: options.onUndo || null });
    toastTimerRef.current = setTimeout(() => setToast(null), options.duration || 4000);
  };
  const dismissToast = () => { if (toastTimerRef.current) clearTimeout(toastTimerRef.current); setToast(null); };

  // Filtering
  const filtered = useMemo(() => {
    let result = [...items];

    if (search) {
      const q = search.toLowerCase();
      result = result.filter(i => i.title.toLowerCase().includes(q) ||
        (i.network && i.network.toLowerCase().includes(q)));
    }

    if (filterStatus !== 'all') {
      if (filterStatus === 'unwatched') {
        result = result.filter(i => i.status === 'want_to_watch');
      } else if (filterStatus === 'watching') {
        result = result.filter(i => i.status.startsWith('watching'));
      } else {
        result = result.filter(i => i.status === filterStatus);
      }
    }

    if (filterTypes.length > 0) result = result.filter(i => filterTypes.includes(i.type));
    if (filterWho !== 'all') result = result.filter(i => i.who === filterWho);
    if (filterNetworks.length > 0) result = result.filter(i => filterNetworks.includes(i.network));

    if (filterRating !== 'all') {
      const r = parseFloat(filterRating);
      result = result.filter(i => i.rating >= r);
    }

    // Status sort order: watching > watching_airing > watching_gap > want_to_watch > watched > dont_watch
    const STATUS_ORDER = {
      'watching': 0,
      'watching_airing': 1,
      'watching_gap': 2,
      'want_to_watch': 3,
      'watched': 4,
      'dont_watch': 5,
    };
        // Sort
    result.sort((a, b) => {
      let cmp = 0;
      if (sortBy === 'status') {
        cmp = (STATUS_ORDER[a.status] ?? 99) - (STATUS_ORDER[b.status] ?? 99);
        if (cmp === 0) {
          const pa = (!a.priority || a.priority === '-' || a.priority === 'n/a') ? 99 : parseInt(a.priority);
          const pb = (!b.priority || b.priority === '-' || b.priority === 'n/a') ? 99 : parseInt(b.priority);
          cmp = pa - pb;
          if (cmp === 0) {
            const today = new Date(); today.setHours(0,0,0,0);
            const unrelA = a.releaseDate && new Date(a.releaseDate) > today ? 1 : 0;
            const unrelB = b.releaseDate && new Date(b.releaseDate) > today ? 1 : 0;
            cmp = unrelA - unrelB;
            if (cmp === 0) cmp = a.title.localeCompare(b.title);
          }
        }
      }
      else if (sortBy === 'title') cmp = a.title.localeCompare(b.title);
      else if (sortBy === 'priority') {
        const pa = a.priority === '-' || a.priority === 'n/a' || !a.priority ? 99 : parseInt(a.priority);
        const pb = b.priority === '-' || b.priority === 'n/a' || !b.priority ? 99 : parseInt(b.priority);
        cmp = pa - pb;
        if (cmp === 0) {
          const today = new Date(); today.setHours(0,0,0,0);
          const unrelA = a.releaseDate && new Date(a.releaseDate) > today ? 1 : 0;
          const unrelB = b.releaseDate && new Date(b.releaseDate) > today ? 1 : 0;
          cmp = unrelA - unrelB;
          if (cmp === 0) cmp = a.title.localeCompare(b.title);
        }
      }
      else if (sortBy === 'rating') cmp = (b.rating || 0) - (a.rating || 0);
      else if (sortBy === 'ratedDate') {
        const da = a.ratedDate ? new Date(a.ratedDate) : new Date(0);
        const db = b.ratedDate ? new Date(b.ratedDate) : new Date(0);
        cmp = db - da;
      }
      else if (sortBy === 'releaseDate') {
        const da = a.releaseDate ? new Date(a.releaseDate) : new Date(0);
        const db = b.releaseDate ? new Date(b.releaseDate) : new Date(0);
        cmp = db - da;
      }
      else if (sortBy === 'network') cmp = (a.network || '').localeCompare(b.network || '');
      return sortDir === 'asc' ? cmp : -cmp;
    });

    return result;
  }, [items, search, filterStatus, filterTypes, filterWho, filterNetworks, filterRating, sortBy, sortDir]);

  const displayed = filtered.slice(0, displayCount);

  // Group by title for table view
  const tableRows = useMemo(() => {
    // When text-searching, show every item individually (no collapsing)
    if (search.trim()) {
      return filtered.slice(0, displayCount + 200).map(item => ({ _type: 'item', ...item }));
    }
    const groups = new Map();
    filtered.forEach(item => {
      const key = item.title.toLowerCase().trim();
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(item);
    });
    const result = [];
    const seen = new Set();
    filtered.forEach(item => {
      const key = item.title.toLowerCase().trim();
      if (seen.has(key)) return;
      seen.add(key);
      const group = groups.get(key);
      if (group.length === 1) {
        result.push({ _type: 'item', ...group[0] });
      } else {
        const rated = group.filter(i => i.rating > 0);
        const avg = rated.length ? Math.round(rated.reduce((s,i) => s+i.rating,0)/rated.length*2)/2 : 0;
        result.push({ _type: 'group', _key: key, _items: group, _avgRating: avg, ...group[0] });
        if (expandedGroups.has(key)) {
          const CHILD_STATUS_ORDER = {'watching':0,'watching_airing':1,'watching_gap':2,'want_to_watch':3,'watched':4,'dont_watch':5};
          const sorted = [...group].sort((a, b) => {
            const sa = CHILD_STATUS_ORDER[a.status] ?? 99;
            const sb = CHILD_STATUS_ORDER[b.status] ?? 99;
            if (sa !== sb) return sa - sb;
            // Same status → most recently rated first
            const da = a.ratedDate ? new Date(a.ratedDate) : new Date(0);
            const db = b.ratedDate ? new Date(b.ratedDate) : new Date(0);
            return db - da;
          });
          sorted.forEach(i => result.push({ _type: 'child', _groupKey: key, ...i }));
        }
      }
    });
    return result.slice(0, displayCount + (expandedGroups.size * 20));
  }, [filtered, expandedGroups, displayCount, search]);

  // Stats
  const stats = useMemo(() => {
    const total = items.length;
    const watched = items.filter(i => i.status === 'watched').length;
    const watching = items.filter(i => i.status.startsWith('watching')).length;
    const wantToWatch = items.filter(i => i.status === 'want_to_watch').length;
    const rated = items.filter(i => i.rating > 0).length;
    const avgRating = rated > 0 ? (items.reduce((sum, i) => sum + (i.rating || 0), 0) / rated).toFixed(1) : 0;
    return { total, watched, watching, wantToWatch, rated, avgRating };
  }, [items]);

  // Handlers
  const handleAdd = (formData) => {
    const normalized = { ...formData, title: toTitleCase(formData.title) };
    if (normalized.rating > 0 && normalized.status === 'want_to_watch') {
      normalized.status = 'watched';
      if (!normalized.ratedDate) normalized.ratedDate = new Date().toLocaleDateString('en-US');
    }
    addItem(normalized);
    if (pendingRecDismiss.current) { dismissRec(pendingRecDismiss.current); pendingRecDismiss.current = null; }
    showToast(`🎬 "${normalized.title}" added to your list!`);
  };

  const handleEdit = (formData) => {
    const normalized = { ...formData, title: toTitleCase(formData.title) };
    if (normalized.rating > 0 && normalized.status === 'want_to_watch') {
      normalized.status = 'watched';
      if (!normalized.ratedDate) normalized.ratedDate = new Date().toLocaleDateString('en-US');
    }
    updateItem(normalized.id, normalized);
    setEditItem(null);
    showToast(`✏️ "${normalized.title}" updated!`);
  };

  const handleDelete = (id) => {
    const item = items.find(i => i.id === id);
    deleteItem(id);
    showToast(`🗑 "${item?.title}" removed.`);
  };

  const handleAddNextSeason = async (item) => {
    const nextSeason = (parseInt(item.season) || 0) + 1;

    // Try to pull release date, poster, and overview from TMDB for the next season
    let releaseDate = '';
    let posterUrl = item.posterUrl || '';
    let overview = '';
    let tmdbId = item.tmdbId || null;

    if (TMDB_API_KEY) {
      try {
        // Resolve tmdbId via search if missing
        if (!tmdbId) {
          const sr = await fetch(`https://api.themoviedb.org/3/search/tv?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(item.title)}`);
          const sd = await sr.json();
          tmdbId = sd.results?.[0]?.id || null;
        }
        if (tmdbId) {
          const res = await fetch(`https://api.themoviedb.org/3/tv/${tmdbId}?api_key=${TMDB_API_KEY}`);
          const data = await res.json();
          const seasonData = (data.seasons || []).find(s => s.season_number === nextSeason);
          if (seasonData?.air_date) releaseDate = seasonData.air_date;
          if (seasonData?.poster_path) posterUrl = TMDB_IMG_BASE + seasonData.poster_path;
          else if (data.poster_path && !posterUrl) posterUrl = TMDB_IMG_BASE + data.poster_path;
          if (seasonData?.overview) overview = seasonData.overview;
        }
      } catch(e) {}
    }

    const newItem = {
      title: item.title,
      type: item.type,
      season: String(nextSeason),
      status: 'want_to_watch',
      priority: item.priority || '',
      network: item.network || '',
      who: item.who || '',
      nonFree: item.nonFree || false,
      posterUrl,
      tmdbId: tmdbId || null,
      rating: 0,
      ratedDate: '',
      releaseDate,
      overview,
    };
    const { firestoreId } = await addItem(newItem);
    showToast(`✅ Added ${item.title} S${nextSeason}${releaseDate ? ` · ${releaseDate}` : ''}`, {
      onUndo: async () => {
        await db.collection('content').doc(firestoreId).delete();
      }
    });
  };

  const handleCardClick = (item) => {
    setDetailItem(item);
  };

  const handleSort = (field) => {
    if (sortBy === field) setSortDir(d => d === 'asc' ? 'desc' : 'asc');
    else {
      setSortBy(field);
      setSortDir('asc');
      // Auto-filter to Watched when sorting by rating (only watched items have ratings)
      if (field === 'rating') setFilterStatus('watched');
    }
  };

  const SortArrow = ({ field }) => {
    if (sortBy !== field) return null;
    return <span className="sort-arrow">{sortDir === 'asc' ? '▲' : '▼'}</span>;
  };

  if (!loaded) {
    return (
      <div style={{display:'flex',alignItems:'center',justifyContent:'center',height:'100vh',fontSize:24}}>
        <span>🎬 Loading...</span>
      </div>
    );
  }

  return (

            <div>

              <div className="logo-sub">Track • Rate • Discover</div>
            </div>
          </div>

          <div className="search-bar">
            <span>🔍</span>
            <input placeholder="Search titles, networks..."
              value={search} onChange={e => {
                const v = e.target.value;
                setSearch(v);
                if (v && filterStatus === 'unwatched') setFilterStatus('all');
                if (!v) setFilterStatus('unwatched');
              }} />
            {search && <span style={{cursor:'pointer',color:'var(--text-muted)'}}
              onClick={() => { setSearch(''); setFilterStatus('unwatched'); }}>✕</span>}
          </div>

          <div style={{display:'flex',gap:8,alignItems:'center'}}>
            <div className="view-toggle">
              <button className={view === 'grid' ? 'active' : ''} onClick={() => setView('grid')}
                title="Grid view">▦</button>
              <button className={view === 'table' ? 'active' : ''} onClick={() => setView('table')}
                title="Table view">☰</button>
            </div>
            {!isReadOnly && (
              <button className="btn btn-primary" onClick={() => setShowForm(true)}>
                + Add
              </button>
            )}
            {/* Tools dropdown */}
            {TMDB_API_KEY && !isReadOnly && (
              <div className="tools-desktop-only" style={{position:'relative'}}>
                {(posterProgress || platformProgress || descProgress) ? (
                  <div style={{
                    display:'flex', alignItems:'center', gap:8,
                    background:'var(--bg-card)', border:'1px solid var(--border)',
                    borderRadius:8, padding:'6px 14px', fontSize:13
                  }}>
                    <span>{posterProgress ? '🎨' : descProgress ? '📖' : '📡'}</span>
                    <div style={{width:80, height:6, background:'var(--border)', borderRadius:3, overflow:'hidden'}}>
                      <div style={{
                        width: `${((posterProgress||platformProgress||descProgress).done/(posterProgress||platformProgress||descProgress).total*100).toFixed(0)}%`,
                        height:'100%', background:'var(--accent-gold)', borderRadius:3, transition:'width 0.3s'
                      }}/>
                    </div>
                    <span style={{color:'var(--text-muted)', fontSize:11}}>
                      {(posterProgress||platformProgress||descProgress).done}/{(posterProgress||platformProgress||descProgress).total}
                    </span>
                  </div>
                ) : (
                  <button className="btn btn-secondary" onClick={() => setShowToolsMenu(m => !m)}
                    style={{fontSize:13}}>
                    🛠 Tools ▾
                  </button>
                )}
                {showToolsMenu && !posterProgress && !platformProgress && !descProgress && (
                  <div style={{
                    position:'absolute', top:'calc(100% + 6px)', right:0,
                    background:'var(--bg-card)', border:'1px solid var(--border)',
                    borderRadius:10, padding:'6px', zIndex:50,
                    minWidth:200, boxShadow:'0 8px 24px rgba(0,0,0,0.4)'
                  }} onMouseLeave={() => setShowToolsMenu(false)}>
                    <div style={{padding:'6px 10px 4px', fontSize:10, color:'var(--text-muted)', textTransform:'uppercase', letterSpacing:1}}>
                      One-time fetches
                    </div>
                    <button className="btn btn-secondary" style={{width:'100%',textAlign:'left',borderRadius:6,marginBottom:4,fontSize:13}}
                      onClick={() => { setShowToolsMenu(false); fetchAllPosters(); }}>
                      🎨 Fetch missing posters
                    </button>
                    <button className="btn btn-secondary" style={{width:'100%',textAlign:'left',borderRadius:6,marginBottom:4,fontSize:13}}
                      onClick={() => { setShowToolsMenu(false); fetchAllPlatforms(); }}>
                      📡 Fetch streaming platforms
                    </button>
                    <button className="btn btn-secondary" style={{width:'100%',textAlign:'left',borderRadius:6,fontSize:13}}
                      onClick={() => { setShowToolsMenu(false); fetchAllDescriptions(); }}>
                      📖 Fetch missing descriptions
                    </button>
                    <div style={{height:1,background:'var(--border)',margin:'4px 0'}}/>
                    <button className='btn btn-secondary' style={{width:'100%',textAlign:'left',borderRadius:6,fontSize:13}}
                      onClick={() => { setShowToolsMenu(false); setShowDupesModal(true); }}>
                      🔍 Find duplicates
                    </button>
                    <button className='btn btn-secondary' style={{width:'100%',textAlign:'left',borderRadius:6,fontSize:13,marginTop:4}}
                      onClick={() => { setShowToolsMenu(false); fixAllTitleCasing(); }}>
                      🔤 Fix title casing
                    </button>
                  </div>
                )}
              </div>
            )}

              <button onClick={() => setShowUserMenu(p => !p)} title="Account"

                  cursor:'pointer',color:'var(--text-primary)',display:'flex',alignItems:'center',gap:6}}>
                {user?.photoURL
                  ? <img src={user.photoURL} alt="" style={{width:26,height:26,borderRadius:'50%'}} />

                <span style={{fontSize:11,color:'var(--text-muted)'}}>▾</span>
              </button>

                    <strong style={{color:'var(--text-primary)',fontSize:13}}>{user.displayName || user.email}</strong>
                  </div>
                  <button className="btn btn-secondary" style={{width:'100%',fontSize:13,textAlign:'left'}}
                    onClick={() => { setShowUserMenu(false); onSignOut(); }}>Sign out</button>
                </div>
              )}
            </div>
          </div>
        </div>
        </div>{/* header */}

        <div style={{
          background: 'linear-gradient(90deg, #1a1a0a, #2a2a10)',
          borderBottom: '1px solid var(--accent-gold)',
          padding: '14px 24px', textAlign: 'center', color: 'var(--text-primary)'
        }}>
          <span style={{marginRight: 12}}>
            🎬 Your list is empty! You have <strong>{INITIAL_DATA.length}</strong> entries from Airtable ready to import.
          </span>
          <button className="btn btn-primary btn-sm" onClick={handleImport} disabled={importing}>
            {importing ? '⏳ Importing...' : 'Import all history'}
          </button>
        </div>
      )}

      <div className="stats-bar">
        <div className="stats-inner">
          <div className="stat clickable-stat" onClick={() => { setFilterStatus('all'); setFilterTypes([]); setFilterWho('all'); setFilterNetworks([]); setFilterRating('all'); setSortBy('status'); setSortDir('asc'); setSearch(''); setDisplayCount(60); }}><span className="stat-num">{stats.total}</span> total</div>
          <div className="stat clickable-stat" onClick={() => { setFilterStatus('watched'); setFilterTypes([]); setFilterWho('all'); setFilterNetworks([]); setFilterRating('all'); setSortBy('status'); setSortDir('asc'); setSearch(''); setDisplayCount(60); }}><span className="stat-num">{stats.watched}</span> watched</div>
          <div className="stat clickable-stat" onClick={() => { setFilterStatus('watching'); setFilterTypes([]); setFilterWho('all'); setFilterNetworks([]); setFilterRating('all'); setSortBy('status'); setSortDir('asc'); setSearch(''); setDisplayCount(60); }}><span className="stat-num">{stats.watching}</span> watching</div>
          <div className="stat clickable-stat" onClick={() => { setFilterStatus('want_to_watch'); setFilterTypes([]); setFilterWho('all'); setFilterNetworks([]); setFilterRating('all'); setSortBy('status'); setSortDir('asc'); setSearch(''); setDisplayCount(60); }}><span className="stat-num">{stats.wantToWatch}</span> to watch</div>
          <div className="stat clickable-stat" onClick={() => { setFilterStatus('watched'); setFilterTypes([]); setFilterWho('all'); setFilterNetworks([]); setFilterRating('all'); setSortBy('rating'); setSortDir('desc'); setSearch(''); setDisplayCount(60); }}><span className="stat-num">{stats.rated}</span> rated</div>
          <div className="stat"><span className="stat-num">{stats.avgRating}</span> avg ⭐</div>
          {TMDB_API_KEY && (
            <div className="stat clickable-stat" onClick={toggleRecs} title="Toggle recommendations">
