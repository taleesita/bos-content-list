              {recs !== null && !recsLoading && (() => {
                const n = recs.filter(r => !dismissedRecs.has(r.key) && !(snoozedRecs[r.key] && snoozedRecs[r.key] > Date.now())).length;
                return n > 0 ? <span className="recs-badge" style={{marginLeft:4,fontSize:10}}>{n}</span> : null;
              })()}
            </div>
          )}
          <div className="stat" style={{marginLeft:'auto', color:'var(--text-muted)', fontSize: 11}}>
            Showing {Math.min(displayCount, filtered.length)} of {filtered.length}
          </div>
        </div>
      </div>

      {/* ── RECS PANEL ── */}
      {TMDB_API_KEY && (
        <div className="recs-bar">
          <div className="recs-toggle" onClick={toggleRecs}>
            <span className="recs-toggle-label">
              💡 Recommendations
              {recs !== null && !recsLoading && (() => {
                const visible = recs.filter(r => !dismissedRecs.has(r.key) && !(snoozedRecs[r.key] && snoozedRecs[r.key] > Date.now()));
                return visible.length > 0 ? <span className="recs-badge">{visible.length}</span> : null;
              })()}
              {recsLoading && <span style={{fontSize:12,color:'var(--accent-gold)',fontFamily:'Inter',fontWeight:400,letterSpacing:0}}>fetching…</span>}
            </span>
            <div style={{display:'flex',alignItems:'center',gap:10}}>
              {showRecs && dismissedRecs.size > 0 && (
                <span style={{fontSize:11,color:'var(--text-muted)',padding:'3px 8px',border:'1px solid var(--border)',borderRadius:6,background:'var(--bg-secondary)',cursor:'pointer'}}
                  onClick={(e) => { e.stopPropagation(); setShowRestorePanel(p => !p); }}>
                  ↩ Dismissed ({dismissedRecs.size})
                </span>
              )}
              {showRecs && recs !== null && !recsLoading && (
                <span style={{fontSize:11,color:'var(--text-muted)',padding:'3px 8px',border:'1px solid var(--border)',borderRadius:6,background:'var(--bg-secondary)',cursor:'pointer'}}
                  title="Re-fetches TMDB for new upcoming seasons & fresh recommendations"
                  onClick={(e) => { e.stopPropagation(); setRecs(null); setRecsVisible(10); fetchRecs(); }}>
                  🔄 Refresh
                </span>
              )}
              <span style={{fontSize:11,color:'var(--text-muted)'}}>{showRecs ? '▲ Hide' : '▼ Show'}</span>
            </div>
          </div>

          {showRecs && showRestorePanel && recs && dismissedRecs.size > 0 && (
            <div style={{margin:'0 0 10px 0',background:'var(--bg-secondary)',borderRadius:10,padding:'10px 12px',border:'1px solid var(--border)'}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
                <span style={{fontSize:12,fontWeight:700,color:'var(--text-primary)'}}>Dismissed recommendations</span>
                <span style={{fontSize:11,color:'var(--text-muted)',cursor:'pointer'}} onClick={() => setShowRestorePanel(false)}>✕</span>
              </div>
              <div style={{display:'flex',flexDirection:'column',gap:6}}>
                {recs.filter(r => dismissedRecs.has(r.key)).map(r => (
                  <div key={r.key} style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:8,padding:'5px 8px',background:'var(--bg-card)',borderRadius:7,border:'1px solid var(--border)'}}>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontSize:12,fontWeight:600,color:'var(--text-primary)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{r.title}{r.season ? ` S${r.season}` : ''}</div>
                      <div style={{fontSize:10,color:'var(--accent-gold)'}}>{r.because || r.reason}</div>
                    </div>
                    <button onClick={() => {
                      setDismissedRecs(prev => { const next = new Set(prev); next.delete(r.key); try { localStorage.setItem('dismissed_recs', JSON.stringify([...next])); } catch {} return next; });
                    }} style={{flexShrink:0,fontSize:11,padding:'3px 10px',borderRadius:6,border:'1px solid var(--accent-gold)',background:'transparent',color:'var(--accent-gold)',cursor:'pointer',fontWeight:600}}>
                      Restore
                    </button>
                  </div>
                ))}
                {recs.filter(r => dismissedRecs.has(r.key)).length === 0 && (
                  <div style={{fontSize:12,color:'var(--text-muted)'}}>Nothing left to restore.</div>
                )}
              </div>
            </div>
          )}

          {showRecs && (
            <div style={{paddingBottom:4}}>
              {recsLoading && (
                <div style={{padding:'12px 0',color:'var(--text-muted)',fontSize:13,display:'flex',alignItems:'center',gap:8}}>
                  <span style={{animation:'spin 1s linear infinite',display:'inline-block'}}>⏳</span>
                  Checking TMDB for upcoming seasons &amp; recommendations…
                </div>
              )}
              {recs !== null && (() => {
                const visible = recs.filter(r => !dismissedRecs.has(r.key) && !(snoozedRecs[r.key] && snoozedRecs[r.key] > Date.now()));
                if (!recsLoading && !visible.length) return <div className="recs-empty">✨ No new recs right now — check back after watching more!</div>;
                const page = visible.slice(0, recsVisible);
                const hasMore = visible.length > recsVisible;
                return (<>
                  <div className="recs-scroll">
                    {page.map(rec => {
                      const onMySub = MY_SUBS.includes(rec.platform);
                      const isExpanded = expandedRec === rec.key;
                      const badgeClass = rec.type === 'upcoming' ? 'rec-badge-upcoming' : rec.type === 'new' ? 'rec-badge-new' : 'rec-badge-similar';
                      const badgeLabel = rec.type === 'upcoming' ? '📅 NEW SEASON' : rec.type === 'new' ? '🆕 NEW' : '✨ FOR YOU';
                      return (
                        <div key={rec.key} className="rec-card">
                          <div className="rec-card-poster" style={{cursor: rec.overview ? 'pointer' : 'default'}}
                            onClick={() => rec.overview && setExpandedRec(isExpanded ? null : rec.key)}>
                            {rec.posterUrl
                              ? <img src={rec.posterUrl} alt={rec.title} loading="lazy" />
                              : <span style={{fontSize:32,opacity:0.3}}>{rec.mediaType === 'movie' ? '🎥' : '📺'}</span>
                            }
                            <span className={`rec-card-badge ${badgeClass}`}>{badgeLabel}</span>
                            {isExpanded && rec.overview && (
                              <div className="rec-desc-overlay" style={{overflowY:'auto'}}>
                                <div style={{fontWeight:600,fontSize:11,color:'var(--text-primary)',marginBottom:4}}>{rec.title}</div>
                                <div style={{fontSize:10,lineHeight:1.45,color:'var(--text-secondary)'}}>
                                  {rec.overview}
                                </div>
                                <div style={{marginTop:8,fontSize:9,color:'var(--accent-gold)',flexShrink:0}}>tap again to close</div>
                              </div>
                            )}
                            {rec.platform && !isExpanded && (
                              <span style={{position:'absolute',bottom:5,left:5,fontSize:9,fontWeight:700,padding:'2px 5px',borderRadius:4,
                                background: onMySub ? 'rgba(102,187,106,0.9)' : 'rgba(0,0,0,0.7)',
                                color: onMySub ? '#000' : '#aaa', backdropFilter:'blur(4px)'}}>
                                {rec.platform}
                              </span>
                            )}
                          </div>
                          <div className="rec-card-body">
                            <div className="rec-card-title">{rec.title}{rec.season ? ` S${rec.season}` : ''}</div>
                            <div className="rec-card-reason">
                              {rec.because || rec.reason}
                            </div>
                            <div className="rec-card-because">
                              {(rec.type !== 'similar' && rec.because) ? rec.reason : ''}
                            </div>
                            <div className="rec-card-actions">
                              <button className="rec-add-btn" style={{fontSize:14, opacity: isReadOnly ? 0.35 : 1, cursor: isReadOnly ? 'not-allowed' : 'pointer'}} onClick={() => {
                                if (isReadOnly) return;
                                const priorEntry = items.find(i => i.title.toLowerCase().trim() === rec.title.toLowerCase().trim());
                                setShowForm({
                                  title: rec.title,
                                  type: rec.mediaType === 'movie' ? 'movie' : 'tv',
                                  season: rec.season ? String(rec.season) : (rec.mediaType === 'movie' ? '' : '1'),
                                  status: 'want_to_watch', priority: '1',
                                  network: rec.platform || priorEntry?.network || '', who: priorEntry?.who || 'together',
                                  nonFree: false, posterUrl: rec.posterUrl || '',
                                  tmdbId: rec.tmdbId || null, rating: 0,
                                  ratedDate: '', releaseDate: rec.airDate || '',
                                  overview: rec.overview || '',
                                });
                                pendingRecDismiss.current = rec.key;
                              }}>➕</button>
                              <button className="rec-dismiss-btn" title="Remind me later" style={{opacity: isReadOnly ? 0.35 : 1, cursor: isReadOnly ? 'not-allowed' : 'pointer'}} onClick={() => { if (isReadOnly) return; snoozeRec(rec.key); }}>💤</button>
                              <button className="rec-dismiss-btn" title="Never show again" style={{opacity: isReadOnly ? 0.35 : 1, cursor: isReadOnly ? 'not-allowed' : 'pointer'}} onClick={() => { if (isReadOnly) return; dismissRec(rec.key); }}>❌</button>
                            </div>
                          </div>
                        </div>
                      );
                    })}
                    {hasMore && (
                      <div style={{flexShrink:0,display:'flex',alignItems:'center',paddingRight:8}}>
                        <button className="btn btn-secondary" style={{fontSize:12,padding:'8px 14px',whiteSpace:'nowrap'}}
                          onClick={() => setRecsVisible(v => v + 10)}>
                          Show {Math.min(10, visible.length - recsVisible)} more →
                        </button>
                      </div>
                    )}
                  </div>
                </>);
              })()}
            </div>
          )}
        </div>
      )}

      {/* Filters */}
      <div className="filter-bar">
        {/* Mobile filter toggle */}
        <div className="filter-mobile-bar" onClick={() => setFiltersOpen(f => !f)}>
          <span style={{fontSize:13, fontWeight:600, color:'var(--text-secondary)'}}>
            🎛 Filters {(filterStatus!=='unwatched'||filterTypes.length>0||filterWho!=='all'||filterNetworks.length>0||filterRating!=='all') && <span style={{color:'var(--accent-gold)'}}>●</span>}
          </span>
          <span style={{color:'var(--text-muted)', fontSize:12}}>{filtersOpen ? '▲ Hide' : '▼ Show'}</span>
        </div>
        <div className={`filter-inner-wrap ${filtersOpen ? 'open' : ''}`}>
          {/* ── DESKTOP: chip layout ── */}
          <div className="filter-inner filter-desktop-chips">
            <div className="filter-section">
              <span className="filter-label">Status</span>
              {[{v:'all',l:'All'},{v:'unwatched',l:'👀 Unwatched'},{v:'watched',l:'✅ Watched'},
                {v:'watching',l:'👀👀 Watching'},{v:'want_to_watch',l:'👀 Want'},{v:'dont_watch',l:'❌ Skip'}
              ].map(f => (
                <span key={f.v} className={`filter-chip ${filterStatus===f.v?'active':''}`}
                  onClick={() => { setFilterStatus(f.v); setDisplayCount(60); }}>{f.l}</span>
              ))}
            </div>
            <div className="filter-divider" />
            <div className="filter-section">
              <span className="filter-label">Type</span>
              {filterTypes.length > 0 && (
                <span className="filter-chip" style={{borderColor:'var(--text-muted)',color:'var(--text-muted)',fontSize:10}}
                  onClick={() => { setFilterTypes([]); setDisplayCount(60); }}>All</span>
              )}
              {TYPE_OPTIONS.map(t => (
                <span key={t.value} className={`filter-chip ${filterTypes.includes(t.value)?'active':''}`}
                  onClick={() => { setFilterTypes(prev => prev.includes(t.value) ? prev.filter(x => x !== t.value) : [...prev, t.value]); setDisplayCount(60); }}>{t.emoji}</span>
              ))}
            </div>
            <div className="filter-divider" />
            <div className="filter-section">
              <span className="filter-label">Who</span>
              <span className={`filter-chip ${filterWho==='all'?'active':''}`}
                onClick={() => { setFilterWho('all'); setDisplayCount(60); }}>All</span>
              {WHO_OPTIONS.map(w => (
                <span key={w.value} className={`filter-chip ${filterWho===w.value?'active':''}`}
                  onClick={() => { setFilterWho(w.value); setDisplayCount(60); }}>{w.emoji}</span>
              ))}
            </div>
            <div className="filter-divider" />
            <div className="filter-section">
              <span className="filter-label">Platform</span>
              {[...MY_SUBS, ...NETWORK_OPTIONS.filter(n => !MY_SUBS.includes(n)).sort()].map(n => (
                <span key={n} className={`filter-chip ${filterNetworks.includes(n) ? 'active' : ''}`}
                  onClick={() => { setFilterNetworks(prev => prev.includes(n) ? prev.filter(x => x !== n) : [...prev, n]); setDisplayCount(60); }}>
                  {n}
                </span>
              ))}
            </div>
            <div className="filter-divider" />
            <div className="filter-section">
              <span className="filter-label">Rating</span>
              <select value={filterRating} onChange={e => { setFilterRating(e.target.value); setDisplayCount(60); if (e.target.value !== 'all') setFilterStatus('watched'); }}
                style={{background: filterRating !== 'all' ? 'var(--accent-gold)' : 'var(--bg-secondary)', color: filterRating !== 'all' ? '#000' : 'var(--text-secondary)', border:'1px solid var(--border)', borderRadius:20, padding:'5px 12px', fontSize:12, fontWeight:600, cursor:'pointer', outline:'none'}}>
                <option value="all">All ratings</option>
                {[5,4.5,4,3.5,3,2.5,2,1.5,1,0.5].map(r => <option key={r} value={String(r)}>{r%1===0?'★'.repeat(r):'★'.repeat(Math.floor(r))+'½'}+ ({r}+)</option>)}
              </select>
            </div>
            <div className="filter-divider" />
            <div className="filter-section">
              <span className="filter-label">Sort</span>
              {[{v:'status',l:'Status'},{v:'title',l:'A-Z'},{v:'priority',l:'Priority'},{v:'rating',l:'Rating'},{v:'ratedDate',l:'Recent'}].map(s => (
                <span key={s.v} className={`filter-chip ${sortBy===s.v?'active':''}`}
                  onClick={() => handleSort(s.v)}>{s.l} {sortBy===s.v && (sortDir==='asc'?'↑':'↓')}</span>
              ))}
            </div>
            {(filterStatus !== 'unwatched' || filterTypes.length > 0 || filterWho !== 'all' || filterNetworks.length > 0 || filterRating !== 'all' || search || sortBy !== 'status') && (
              <><div className="filter-divider" />
              <span className="filter-chip" style={{borderColor:'var(--accent-red)',color:'#ef5350',whiteSpace:'nowrap'}}
                onClick={() => { setFilterStatus('unwatched'); setFilterTypes([]); setFilterWho('all'); setFilterNetworks([]); setFilterRating('all'); setSortBy('status'); setSortDir('asc'); setSearch(''); setDisplayCount(60); }}>
                ✕ Clear filters
              </span></>
            )}
          </div>

          {/* ── MOBILE: dropdown layout ── */}
          <div className="filter-mobile-dropdowns" style={{padding:'8px 0'}}>
            <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:8, marginBottom:8}}>
              <div>
                <div className="filter-mobile-label">Status</div>
                <select className={`filter-mobile-select ${filterStatus!=='unwatched'?'active':''}`} value={filterStatus}
                  onChange={e => { setFilterStatus(e.target.value); setDisplayCount(60); }}>
                  {[{v:'unwatched',l:'👀 Unwatched'},{v:'all',l:'All'},{v:'watched',l:'✅ Watched'},
                    {v:'watching',l:'👀👀 Watching'},{v:'want_to_watch',l:'👀 Want'},{v:'dont_watch',l:'❌ Skip'}
                  ].map(f => <option key={f.v} value={f.v}>{f.l}</option>)}
                </select>
              </div>
              <div>
                <div className="filter-mobile-label">Type</div>
                <select className={`filter-mobile-select ${filterTypes.length>0?'active':''}`}
                  value={filterTypes.length === 1 ? filterTypes[0] : 'all'}
                  onChange={e => { e.target.value === 'all' ? setFilterTypes([]) : setFilterTypes([e.target.value]); setDisplayCount(60); }}>
                  <option value="all">All types</option>
                  {TYPE_OPTIONS.map(t => <option key={t.value} value={t.value}>{t.label}</option>)}
                </select>
              </div>
              <div>
                <div className="filter-mobile-label">Who</div>
                <select className={`filter-mobile-select ${filterWho!=='all'?'active':''}`} value={filterWho}
                  onChange={e => { setFilterWho(e.target.value); setDisplayCount(60); }}>
                  <option value="all">Everyone</option>
                  {WHO_OPTIONS.map(w => <option key={w.value} value={w.value}>{w.label}</option>)}
                </select>
              </div>
              <div>
                <div className="filter-mobile-label">Rating</div>
                <select className={`filter-mobile-select ${filterRating!=='all'?'active':''}`} value={filterRating}
                  onChange={e => { setFilterRating(e.target.value); setDisplayCount(60); if (e.target.value !== 'all') setFilterStatus('watched'); }}>
                  <option value="all">All ratings</option>
                  {[5,4.5,4,3.5,3,2.5,2,1.5,1,0.5].map(r => <option key={r} value={String(r)}>{r%1===0?'★'.repeat(r):'★'.repeat(Math.floor(r))+'½'}+ ({r}+)</option>)}
                </select>
              </div>
              <div>
                <div className="filter-mobile-label">Sort by</div>
                <select className="filter-mobile-select active" value={sortBy}
                  onChange={e => { setSortBy(e.target.value); setDisplayCount(60); }}>
                  {[{v:'status',l:'Status'},{v:'title',l:'A–Z'},{v:'priority',l:'Priority'},{v:'rating',l:'Rating'},{v:'ratedDate',l:'Recently rated'}].map(s => (
                    <option key={s.v} value={s.v}>{s.l}</option>
                  ))}
                </select>
              </div>
              <div style={{display:'flex',alignItems:'flex-end'}}>
                {(filterStatus !== 'unwatched' || filterTypes.length > 0 || filterWho !== 'all' || filterNetworks.length > 0 || filterRating !== 'all' || search || sortBy !== 'status') && (
                  <button className="filter-mobile-select" style={{background:'rgba(239,83,80,0.1)',color:'#ef5350',border:'1px solid #ef5350',fontWeight:600,cursor:'pointer'}}
                    onClick={() => { setFilterStatus('unwatched'); setFilterTypes([]); setFilterWho('all'); setFilterNetworks([]); setFilterRating('all'); setSortBy('status'); setSortDir('asc'); setSearch(''); setDisplayCount(60); }}>
                    ✕ Clear filters
                  </button>
                )}
              </div>
            </div>
            {/* Platform — always chips in a scrolling row */}
            <div>
              <div className="filter-mobile-label">Platform {filterNetworks.length > 0 && <span style={{color:'var(--accent-gold)'}}>({filterNetworks.length} selected)</span>}</div>
              <div className="filter-platform-scroll">
                {[...MY_SUBS, ...NETWORK_OPTIONS.filter(n => !MY_SUBS.includes(n)).sort()].map(n => (
                  <span key={n} className={`filter-chip ${filterNetworks.includes(n)?'active':''}`}
                    style={{flexShrink:0, fontSize:12, padding:'4px 10px'}}
                    onClick={() => { setFilterNetworks(prev => prev.includes(n) ? prev.filter(x => x !== n) : [...prev, n]); setDisplayCount(60); }}>
                    {n}
                  </span>
                ))}
              </div>
            </div>
          </div>
        </div>
      </div>{/* filter-bar */}

      {/* Content */}
      <div className="content-area">
        {filtered.length === 0 ? (
          <div className="empty-state">
            {search && globalTMDB.results.length > 0 && !isReadOnly ? (
              <>
                <div className="empty-state-icon">🔍</div>
                <div className="empty-state-text">"{search}" isn't in your list yet</div>
                <div className="empty-state-sub" style={{marginBottom: 20}}>Want to add one of these?</div>
                <div className="search-suggest-grid">
                  {globalTMDB.results.slice(0, 6).map(r => {
                    const mediaType = r.media_type === 'movie' ? 'movie' : 'tv';
                    const year = (r.release_date || r.first_air_date || '').slice(0, 4);
                    const typeLabel = mediaType === 'movie' ? '🎬 Movie' : '📺 TV';
                    return (
                      <div key={r.id} className="search-suggest-card">
                        {r.poster_path
                          ? <img className="search-suggest-poster" src={TMDB_IMG_BASE + r.poster_path} alt="" />
                          : <div className="search-suggest-poster-placeholder">🎬</div>
                        }
                        <div className="search-suggest-info">
                          <div className="search-suggest-title">{r.title || r.name}</div>
                          <div className="search-suggest-meta">{year && `${year} · `}{typeLabel}</div>
                        </div>
                        <button className="search-suggest-add" onClick={async () => {
                          const posterPath = r.poster_path ? TMDB_IMG_BASE + r.poster_path : '';
                          const releaseDate = r.release_date || r.first_air_date || '';
                          const formData = {
                            title: r.title || r.name || '',
                            type: mediaType,
                            posterUrl: posterPath,
                            tmdbId: r.id,
                            releaseDate,
                            overview: r.overview || '',
                            status: 'want_to_watch',
                            priority: '1',
                            season: mediaType === 'tv' ? '1' : '',
                          };
                          // Fetch network from providers, fall back to show networks
                          const provider = await fetchProviders(r.id, mediaType);
                          if (provider) formData.network = provider;
                          if (!provider && mediaType === 'tv') {
                            try {
                              const tvData = await fetch(`https://api.themoviedb.org/3/tv/${r.id}?api_key=${TMDB_API_KEY}`).then(x => x.json());
                              for (const net of (tvData.networks || [])) {
                                const mapped = TMDB_NETWORK_NAME_MAP[net.name];
                                if (mapped) { formData.network = mapped; break; }
                              }
                            } catch(e) {}
                          }
                          setSearch('');
                          globalTMDB.clear();
                          setShowForm(formData);
                        }}>➕ Add</button>
                      </div>
                    );
                  })}
                </div>
              </>
            ) : (
              <>
                <div className="empty-state-icon">🎬</div>
                <div className="empty-state-text">No content found</div>
                <div className="empty-state-sub">Try adjusting your filters or search</div>
              </>
            )}
          </div>
        ) : view === 'grid' ? (
          <>
            <div className="grid-view">
              {displayed.map(item => (
                <ContentCard key={`${item.id}-${item.season}`} item={item} onClick={handleCardClick} />
              ))}
            </div>
            {displayCount < filtered.length && (
              <div className="load-more">
                <button className="btn btn-secondary"
                  onClick={() => setDisplayCount(c => c + 60)}>
                  Load more ({filtered.length - displayCount} remaining)
                </button>
              </div>
            )}
          </>
        ) : (
          <div className="table-view">
            <table>
              <thead>
                <tr>
                  <th onClick={() => handleSort('title')}>Title <SortArrow field="title" /></th>
                  <th>Status</th>
                  <th onClick={() => handleSort('priority')}>Priority <SortArrow field="priority" /></th>
                  <th>Type</th>
                  <th>Season</th>
                  <th>Who</th>
                  <th onClick={() => handleSort('network')}>Network <SortArrow field="network" /></th>
                  <th onClick={() => handleSort('releaseDate')}>Release <SortArrow field="releaseDate" /></th>
                  <th onClick={() => handleSort('rating')}>Rating <SortArrow field="rating" /></th>
                  <th onClick={() => handleSort('ratedDate')}>Rated <SortArrow field="ratedDate" /></th>
                  <th>Non-Free</th>
                </tr>
              </thead>
              <tbody>
                {tableRows.map((row, idx) => {
                  if (row._type === 'group') {
                    const isExpanded = expandedGroups.has(row._key);
                    const seasons = row._items.map(i => i.season).filter(Boolean);
                    return (
                      <tr key={row._key + '-group'} style={{background:'rgba(245,197,24,0.04)', cursor:'pointer'}}
                        onClick={() => setExpandedGroups(prev => {
                          const next = new Set(prev);
                          next.has(row._key) ? next.delete(row._key) : next.add(row._key);
                          return next;
                        })}>
                        <td>
                          <div style={{display:'flex',alignItems:'center',gap:6}}>
                            {(() => { const p = row.posterUrl || (row._items.find(i=>i.posterUrl)||{}).posterUrl; return p ? <img src={p} className='table-poster-thumb' alt='' loading='lazy' /> : null; })()}
                            <span style={{fontSize:11,color:'var(--text-muted)',width:12,flexShrink:0}}>{isExpanded ? '▼' : '▶'}</span>
                            <span style={{fontWeight:600}}>{row.title}</span>
                            <span style={{fontSize:10,background:'rgba(245,197,24,0.15)',color:'var(--accent-gold)',padding:'1px 6px',borderRadius:4,fontWeight:700,flexShrink:0}}>
                              {row._items.length} seasons
                            </span>
                          </div>
                        </td>
                        <td><span className={`tag ${getStatusTagClass(row.status)}`}>{getStatusLabel(row.status)}</span></td>
                        <td style={{textAlign:'center'}}>{row.priority || '—'}</td>
                        <td>{getTypeEmoji(row.type)}</td>
                        <td style={{fontSize:11,color:'var(--text-muted)'}}>{seasons.join(', ')}</td>
                        <td>{getWhoEmoji(row.who)}</td>
                        <td><span className="card-network">{row.network || '—'}</span></td>
                        <td>{row._avgRating > 0 ? <StarRating rating={row._avgRating} size={12}/> : <span style={{color:'var(--text-muted)'}}>—</span>}</td>
                        <td></td>
                        <td>{row.nonFree ? <span className="tag tag-nonfree">$</span> : ''}</td>
                      </tr>
                    );
                  }
                  if (row._type === 'child') {
                    return <ContentTableRow key={`${row.id}-${row.season}-child`} item={row} onClick={handleCardClick} inlineEdit={inlineEdit} setInlineEdit={setInlineEdit} onUpdate={updateItem} isReadOnly={isReadOnly} />;
                  }
                  return <ContentTableRow key={`${row.id}-${row.season}`} item={row} onClick={handleCardClick} inlineEdit={inlineEdit} setInlineEdit={setInlineEdit} onUpdate={updateItem} isReadOnly={isReadOnly} />;
                })}
              </tbody>
            </table>
            {displayCount < filtered.length && (
              <div className="load-more">
                <button className="btn btn-secondary"
                  onClick={() => setDisplayCount(c => c + 100)}>
                  Load more ({filtered.length - displayCount} remaining)
                </button>
              </div>
            )}
          </div>
        )}
      </div>

      {/* Modals */}
      {showForm && !isReadOnly && (
        <FormModal item={showForm !== true ? showForm : null} onSave={handleAdd} onClose={() => { setShowForm(false); pendingRecDismiss.current = null; }} />
      )}

      {editItem && !isReadOnly && (
        <FormModal item={editItem} isEdit onSave={handleEdit}
          onClose={() => setEditItem(null)} />
      )}

      {detailItem && (
        <DetailModal item={detailItem} onClose={() => setDetailItem(null)}
          onEdit={(item) => { setDetailItem(null); setEditItem(item); }}
          onDelete={handleDelete}
          onAddNextSeason={handleAddNextSeason}
          isReadOnly={isReadOnly} />
      )}

      {/* Dupes modal */}
      {showDupesModal && (() => {
        const groups = {};
        items.forEach(item => {
          const key = (item.title || '').toLowerCase().trim();
          if (!groups[key]) groups[key] = [];
          groups[key].push(item);
        });
        const dupeGroups = Object.values(groups).filter(g => g.length > 1).sort((a,b) => a[0].title.localeCompare(b[0].title));
        return (
          <div className="modal-overlay" onClick={e => e.target===e.currentTarget && setShowDupesModal(false)}>
            <div className="modal" style={{maxWidth:700}}>
              <div className="modal-header">
                <h2>🔍 Find Duplicates</h2>
                <button className="modal-close" onClick={() => setShowDupesModal(false)}>&times;</button>
              </div>
              <div className="modal-body" style={{maxHeight:'65vh',overflowY:'auto'}}>
                {dupeGroups.length === 0 ? (
                  <div style={{textAlign:'center',padding:40,color:'var(--text-muted)'}}>
                    🎉 No duplicate titles found!
                  </div>
                ) : (
                  <>
                  <div style={{marginBottom:12,fontSize:12,color:'var(--text-muted)'}}>
                    Found {dupeGroups.length} title{dupeGroups.length>1?'s':''} with multiple entries. Click 🗑 to delete a specific entry.
                  </div>
                  {dupeGroups.map(group => (
                    <div key={group[0].title} style={{
                      marginBottom:16,background:'var(--bg-secondary)',borderRadius:10,
                      border:'1px solid var(--border)',overflow:'hidden'
                    }}>
                      <div style={{padding:'8px 14px',background:'rgba(245,197,24,0.08)',
                        borderBottom:'1px solid var(--border)',fontWeight:600,fontSize:13}}>
                        {group[0].title} <span style={{color:'var(--text-muted)',fontWeight:400,fontSize:11}}>({group.length} entries)</span>
                      </div>
                      {group.map(item => (
                        <div key={item.id} style={{
                          display:'flex',alignItems:'center',gap:10,padding:'8px 14px',
                          borderBottom:'1px solid rgba(255,255,255,0.04)'
                        }}>
                          {item.posterUrl && <img src={item.posterUrl} style={{width:28,height:40,objectFit:'cover',borderRadius:3,flexShrink:0}} alt="" />}
                          <div style={{flex:1,fontSize:12}}>
                            <span style={{color:'var(--text-muted)'}}>S{item.season || '—'}</span>
                            {' · '}
                            <span className={`tag ${getStatusTagClass(item.status)}`} style={{fontSize:10}}>{getStatusLabel(item.status)}</span>
                            {item.rating > 0 && <> · <span>★{item.rating}</span></>}
                            {' · '}<span style={{color:'var(--text-muted)'}}>{item.network || 'no network'}</span>
                            {item.ratedDate && <span style={{color:'var(--text-muted)',marginLeft:8}}>{item.ratedDate.slice(0,10)}</span>}
                          </div>
                          <button
                            style={{background:'rgba(239,83,80,0.15)',border:'1px solid rgba(239,83,80,0.3)',
                              color:'#ef5350',borderRadius:6,padding:'3px 10px',cursor:'pointer',fontSize:12,flexShrink:0}}
                            onClick={() => { if(window.confirm('Delete this entry?')) handleDelete(item); }}>
                            🗑 Delete
                          </button>
                        </div>
                      ))}
                    </div>
                  ))}
                  </>
                )}
              </div>
            </div>
          </div>
        );
      })()}

      {/* Toast */}
      {toast && (
        <div className="toast">
          <span className="toast-msg">{toast.msg}</span>
          {toast.onUndo && (
            <button className="toast-undo" onClick={async () => { await toast.onUndo(); dismissToast(); }}>
              Undo
            </button>
          )}
        </div>
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><AuthWrapper><App /></AuthWrapper></ErrorBoundary>);
</script>



</body>
</html>
